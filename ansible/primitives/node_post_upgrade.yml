---
# Read-only post-upgrade diagnostics for a Proxmox node.
# Python owns all classification and reboot policy; this primitive only returns facts.
#
# Every task is check_mode: false because these are read-only probes that must
# run even under `--check` — the control plane classifies the returned facts
# (reboot-required marker, configured next-boot kernel, NVIDIA target/loaded
# module versions, target-kernel DKMS state, nvidia-smi probe).
#
# Params (extravars):
#   target_hosts     host to probe (set by invoke_primitive)
#   nvidia_host      bool — run the NVIDIA diagnostic tasks (set by Python from
#                    inventory; the play also honours the inventory var via the
#                    same `nvidia_host | default(false)` read)
#   after_reboot     bool — validate NVIDIA against the running kernel rather
#                    than the configured target (strict post-reboot check)
- name: "Node post-upgrade primitive"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  tasks:
    - name: "Read running kernel"
      ansible.builtin.command:
        argv: [uname, -r]
      environment:
        LC_ALL: C
      register: _running_kernel
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Read latest installed kernel"
      ansible.builtin.shell: >-
        set -o pipefail &&
        ls -1 /boot/vmlinuz-* 2>/dev/null |
        sort -V |
        tail -n1 |
        sed 's|.*vmlinuz-||'
      args:
        executable: /bin/bash
      environment:
        LC_ALL: C
      register: _latest_kernel
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Resolve configured next-boot kernel"
      ansible.builtin.shell: |
        set -o pipefail

        installed_from_entry() {
          local entry="$1"
          local image kernel
          for image in /boot/vmlinuz-*; do
            [ -e "$image" ] || continue
            kernel="${image##*/vmlinuz-}"
            case "$entry" in
              *"$kernel"*) printf '%s' "$kernel"; return 0 ;;
            esac
          done
          return 1
        }

        read_efi_entry() {
          local prefix="$1"
          local path
          path="$(find /sys/firmware/efi/efivars -maxdepth 1 \
            -name "${prefix}-*" -print -quit 2>/dev/null)"
          [ -n "$path" ] || return 1
          dd if="$path" bs=1 skip=4 2>/dev/null | tr -d '\000'
        }

        emit_entry_target() {
          local entry="$1"
          local source="$2"
          local kernel
          [ -n "$entry" ] || return 1
          case "$entry" in *\**) return 1 ;; esac
          kernel="$(installed_from_entry "$entry")" || {
            printf 'configured %s entry does not match an installed kernel: %s\n' \
              "$source" "$entry" >&2
            return 2
          }
          printf '%s|%s\n' "$kernel" "$source"
        }

        bootloader=unknown
        if bootctl status --no-pager 2>/dev/null | grep -qE \
          'Product:[[:space:]]*systemd-boot'; then
          bootloader=systemd-boot
        elif [ -r /boot/grub/grub.cfg ]; then
          bootloader=grub
        fi

        if [ "$bootloader" = systemd-boot ]; then
          entry="$(read_efi_entry LoaderEntryOneShot || true)"
          if [ -n "$entry" ]; then
            emit_entry_target "$entry" systemd-boot-oneshot
            exit $?
          fi
        elif [ "$bootloader" = grub ] && command -v grub-editenv >/dev/null 2>&1; then
          entry="$(grub-editenv list 2>/dev/null | sed -n 's/^next_entry=//p' | head -n1)"
          if [ -n "$entry" ]; then
            emit_entry_target "$entry" grub-next-entry
            exit $?
          fi
        fi

        if [ "$bootloader" = systemd-boot ]; then
          entry="$(read_efi_entry LoaderEntryPreferred || true)"
          if [ -n "$entry" ] && ! [[ "$entry" == *\** ]]; then
            emit_entry_target "$entry" systemd-boot-preferred
            exit $?
          fi
          entry="$(read_efi_entry LoaderEntryDefault || true)"
          if [ -n "$entry" ] && ! [[ "$entry" == *\** ]]; then
            emit_entry_target "$entry" systemd-boot-default
            exit $?
          fi
        fi

        if [ -s /etc/kernel/next-boot-pin ]; then
          kernel="$(tr -d '[:space:]' </etc/kernel/next-boot-pin)"
          if [ ! -r "/boot/vmlinuz-$kernel" ]; then
            printf 'next-boot pin is not installed: %s\n' "$kernel" >&2
            exit 2
          fi
          printf '%s|proxmox-next-boot-pin\n' "$kernel"
          exit 0
        fi

        if [ -s /etc/kernel/proxmox-boot-pin ]; then
          kernel="$(tr -d '[:space:]' </etc/kernel/proxmox-boot-pin)"
          if [ ! -r "/boot/vmlinuz-$kernel" ]; then
            printf 'persistent kernel pin is not installed: %s\n' "$kernel" >&2
            exit 2
          fi
          printf '%s|proxmox-persistent-pin\n' "$kernel"
          exit 0
        fi

        latest={{ _latest_kernel.stdout | default('') | trim | quote }}
        if [ "$bootloader" = systemd-boot ]; then
          boot_status="$(proxmox-boot-tool status 2>/dev/null || true)"
          configured_sets="$(printf '%s\n' "$boot_status" |
            sed -n 's/.*(versions: \([^)]*\)).*/\1/p' |
            while IFS= read -r versions; do
              printf '%s\n' "$versions" | tr ',' '\n' |
                sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
                sed '/^$/d' | sort -V | paste -sd, -
            done)"
          first_set="$(printf '%s\n' "$configured_sets" | head -n1)"
          if [ -z "$first_set" ]; then
            printf 'could not read kernels synced to systemd-boot ESPs\n' >&2
            exit 1
          fi
          if printf '%s\n' "$configured_sets" | grep -Fvxq "$first_set"; then
            printf 'systemd-boot ESPs disagree on configured kernels\n' >&2
            exit 2
          fi
          kernel="$(printf '%s\n' "$first_set" | tr ',' '\n' | sort -V | tail -n1)"
          if [ ! -r "/boot/vmlinuz-$kernel" ]; then
            printf 'systemd-boot default kernel is not installed: %s\n' "$kernel" >&2
            exit 2
          fi
          printf '%s|systemd-boot-automatic\n' "$kernel"
          exit 0
        fi

        if [ "$bootloader" = grub ]; then
          grub_default="$(awk -F= '/^[[:space:]]*GRUB_DEFAULT=/{value=$2} END {
            gsub(/^[[:space:]\047\"]+|[[:space:]\047\"]+$/, "", value); print value
          }' /etc/default/grub /etc/default/grub.d/*.cfg 2>/dev/null)"
          if [ "$grub_default" = saved ]; then
            entry="$(grub-editenv list 2>/dev/null | sed -n 's/^saved_entry=//p' | head -n1)"
            if [ -z "$entry" ]; then
              printf 'GRUB_DEFAULT=saved but saved_entry is unset\n' >&2
              exit 2
            fi
            emit_entry_target "$entry" grub-saved-entry
            exit $?
          elif [ -n "$grub_default" ] && [ "$grub_default" != 0 ]; then
            emit_entry_target "$grub_default" grub-default
            exit $?
          fi
          if [ -z "$latest" ] || [ ! -r "/boot/vmlinuz-$latest" ] ||
             ! grep -Fq "/vmlinuz-$latest" /boot/grub/grub.cfg; then
            printf 'could not resolve automatic GRUB next-boot kernel\n' >&2
            exit 1
          fi
          printf '%s|grub-automatic\n' "$latest"
          exit 0
        fi

        printf 'could not identify active Proxmox boot loader\n' >&2
        exit 1
      args:
        executable: /bin/bash
      environment:
        LC_ALL: C
      register: _target_kernel_result
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Store configured target kernel facts"
      ansible.builtin.set_fact:
        _target_kernel: >-
          {{ ((_target_kernel_result.stdout | default('') | trim).split('|') | first) | default('') }}
        _target_kernel_source: >-
          {{ ((_target_kernel_result.stdout | default('') | trim).split('|'))[1] | default('unknown') }}
        _nvidia_kernel: >-
          {{ (_running_kernel.stdout | default('') | trim)
             if (after_reboot | default(false) | bool)
             else (((_target_kernel_result.stdout | default('') | trim).split('|') | first) | default('')) }}
      changed_when: false
      check_mode: false

    - name: "Check Debian reboot marker"
      ansible.builtin.stat:
        path: /run/reboot-required
      register: _reboot_required
      changed_when: false
      check_mode: false

    - name: "Read Debian reboot package list"
      ansible.builtin.command:
        argv: [cat, /run/reboot-required.pkgs]
      environment:
        LC_ALL: C
      register: _reboot_packages
      changed_when: false
      failed_when: false
      check_mode: false

    # Debian's nvidia-kernel-dkms installs `nvidia-current*` module names while
    # Ubuntu/NVIDIA packages install `nvidia*`. Validate the complete base,
    # modeset, DRM and UVM family for the selected kernel, then return its base
    # module version.
    - name: "Read NVIDIA module version for validation kernel"
      ansible.builtin.shell: |
        set -o pipefail
        kernel={{ _nvidia_kernel | quote }}
        if version="$(modinfo -k "$kernel" -F version nvidia 2>/dev/null)"; then
          modules=(nvidia nvidia_modeset nvidia_drm nvidia_uvm)
        elif version="$(modinfo -k "$kernel" -F version nvidia-current 2>/dev/null)"; then
          modules=(nvidia-current nvidia-current-modeset nvidia-current-drm nvidia-current-uvm)
        else
          exit 1
        fi
        for module in "${modules[@]}"; do
          modinfo -k "$kernel" "$module" >/dev/null 2>&1 || exit 1
        done
        printf '%s\n' "$version"
      args:
        executable: /bin/bash
      environment:
        LC_ALL: C
      register: _nvidia_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - nvidia_host | default(false) | bool
        - (_nvidia_kernel | default('') | trim) != ''

    - name: "Read loaded NVIDIA module version"
      ansible.builtin.shell: >-
        (cat /sys/module/nvidia/version 2>/dev/null ||
         cat /sys/module/nvidia-current/version 2>/dev/null) || exit 1
      args:
        executable: /bin/bash
      environment:
        LC_ALL: C
      register: _nvidia_loaded
      changed_when: false
      failed_when: false
      check_mode: false
      when: nvidia_host | default(false) | bool

    - name: "Read DKMS state for NVIDIA validation kernel"
      ansible.builtin.command:
        argv:
          - dkms
          - status
          - -k
          - "{{ _nvidia_kernel | default('') | trim }}"
      environment:
        LC_ALL: C
      register: _nvidia_dkms
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - nvidia_host | default(false) | bool
        - (_nvidia_kernel | default('') | trim) != ''

    - name: "Probe NVIDIA device health"
      ansible.builtin.command:
        argv:
          - nvidia-smi
          - --query-gpu=index
          - --format=csv,noheader
      environment:
        LC_ALL: C
      register: _nvidia_smi
      changed_when: false
      failed_when: false
      check_mode: false
      when: nvidia_host | default(false) | bool

    - name: "Return post-upgrade diagnostics to control plane"
      ansible.builtin.set_stats:
        data:
          diagnostics_version: 2
          running_kernel_rc: "{{ _running_kernel.rc | default(1) }}"
          running_kernel: "{{ _running_kernel.stdout | default('') | trim }}"
          latest_kernel_rc: "{{ _latest_kernel.rc | default(1) }}"
          latest_kernel: "{{ _latest_kernel.stdout | default('') | trim }}"
          target_kernel_rc: "{{ _target_kernel_result.rc | default(1) }}"
          target_kernel: "{{ _target_kernel | default('') | trim }}"
          target_kernel_source: "{{ _target_kernel_source | default('unknown') | trim }}"
          reboot_required_exists: "{{ _reboot_required.stat.exists | default(false) }}"
          reboot_required_packages: "{{ _reboot_packages.stdout | default('') }}"
          nvidia_checked: "{{ nvidia_host | default(false) | bool }}"
          nvidia_kernel: "{{ _nvidia_kernel | default('') | trim }}"
          nvidia_installed_rc: "{{ _nvidia_installed.rc | default(1) }}"
          nvidia_installed: "{{ _nvidia_installed.stdout | default('') | trim }}"
          nvidia_loaded_rc: "{{ _nvidia_loaded.rc | default(1) }}"
          nvidia_loaded: "{{ _nvidia_loaded.stdout | default('') | trim }}"
          nvidia_dkms_rc: "{{ _nvidia_dkms.rc | default(1) }}"
          nvidia_dkms_status: "{{ _nvidia_dkms.stdout | default('') }}"
          nvidia_smi_rc: "{{ _nvidia_smi.rc | default(1) }}"
        aggregate: false
      changed_when: false
      check_mode: false
