---
# Execution primitive: roll back an LXC container to the BEFORE_UPDATE_AUTO
# snapshot using `pct rollback`. Called by the rescue path only when a snapshot
# was previously confirmed created (snap_taken=True).
# Makes no decisions. Invoked by proxmox_fleet.flows.lxc (rescue block).
#
# Params (extravars):
#   target_hosts   Proxmox node hosting the container (set by invoke_primitive)
#   lxc_id         Container VMID
- name: "rollback primitive"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  tasks:
    - name: "Roll back container to BEFORE_UPDATE_AUTO"
      ansible.builtin.command: "pct rollback {{ lxc_id }} BEFORE_UPDATE_AUTO"
      register: _res
      check_mode: false

    - name: "Return result"
      ansible.builtin.set_stats:
        data:
          rc: "{{ _res.rc | default(1) }}"
          stdout: "{{ _res.stdout | default('') }}"
          stderr: "{{ _res.stderr | default('') }}"
          changed: "{{ _res.rc | default(1) == 0 }}"
        aggregate: false
