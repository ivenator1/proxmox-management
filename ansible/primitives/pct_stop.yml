---
# Execution primitive: stop a running LXC container.
# Makes no decisions. Invoked by proxmox_fleet.flows.lxc (always block).
#
# Params (extravars):
#   target_hosts   Proxmox node hosting the container (set by invoke_primitive)
#   lxc_id         Container VMID
- name: "pct_stop primitive"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  tasks:
    - name: "Stop container"
      ansible.builtin.command: "pct stop {{ lxc_id }}"
      register: _res
      check_mode: false

    - name: "Return result"
      ansible.builtin.set_stats:
        data:
          rc: "{{ _res.rc | default(1) }}"
          stdout: "{{ _res.stdout | default('') }}"
          stderr: "{{ _res.stderr | default('') }}"
          changed: "{{ _res.rc | default(1) == 0 }}"
        aggregate: false
