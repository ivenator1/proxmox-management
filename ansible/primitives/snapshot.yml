---
# Execution primitive: create or delete a snapshot (LXC or VM) via the Proxmox
# API. community.proxmox.proxmox_snap is vmid-agnostic — it handles both
# LXC containers and QEMU VMs. Runs on localhost since the module speaks the
# API directly; no SSH to the node is needed.
# Makes no decisions. Invoked by proxmox_fleet.executor.RunnerExecutor.snapshot().
#
# Params (extravars):
#   vmid               Container or VM VMID
#   snap_state         "present" to create, "absent" to delete
#   api_host           Proxmox node API IP (ansible_host of the node)
#   api_user           PVE API user (e.g. root@pam)
#   api_token_id       API token ID
#   api_token_secret   API token secret
#   timeout            Overall snapshot operation timeout in seconds
#   api_timeout        Per-request Proxmox API timeout in seconds
- name: "snapshot primitive"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Manage snapshot BEFORE_UPDATE_AUTO"
      community.proxmox.proxmox_snap:
        api_host: "{{ api_host }}"
        api_user: "{{ api_user }}"
        api_token_id: "{{ api_token_id }}"
        api_token_secret: "{{ api_token_secret }}"
        # PVE nodes ship self-signed certs; community.proxmox 2.x flipped the
        # default to validate them, which breaks every direct-to-node API call.
        validate_certs: false
        timeout: "{{ timeout }}"
        api_timeout: "{{ api_timeout }}"
        vmid: "{{ vmid }}"
        snapname: "BEFORE_UPDATE_AUTO"
        state: "{{ snap_state }}"
      register: _snap

    - name: "Return result"
      ansible.builtin.set_stats:
        data:
          changed: "{{ _snap.changed | default(false) }}"
          failed: "{{ _snap.failed | default(false) }}"
        aggregate: false
