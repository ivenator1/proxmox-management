---
# Read-only Alloy compliance probe for a directly reachable VM guest.
- name: "Alloy VM probe primitive"
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  become: true
  tasks:
    - name: "Check Alloy binary"
      ansible.builtin.command:
        argv: [test, -x, /usr/bin/alloy]
      register: _alloy_binary
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Hash Alloy configuration"
      ansible.builtin.command:
        argv: [sha256sum, /etc/alloy/config.alloy]
      register: _alloy_config
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Read Alloy supplementary groups"
      ansible.builtin.command:
        argv: [id, -nG, alloy]
      register: _alloy_groups
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Check Alloy service enabled state"
      ansible.builtin.command:
        argv: [systemctl, is-enabled, alloy]
      register: _alloy_enabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Check Alloy service active state"
      ansible.builtin.command:
        argv: [systemctl, is-active, alloy]
      register: _alloy_active
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Detect package manager"
      ansible.builtin.shell: >-
        if command -v apt-get >/dev/null 2>&1; then printf apt;
        elif command -v dnf >/dev/null 2>&1; then printf dnf;
        elif command -v apk >/dev/null 2>&1; then printf apk;
        else printf unknown; fi
      args:
        executable: /bin/sh
      register: _alloy_pkg
      changed_when: false
      check_mode: false

    - name: "Return Alloy probe facts"
      ansible.builtin.set_stats:
        data:
          binary_present: "{{ _alloy_binary.rc | default(1) == 0 }}"
          package_manager: "{{ _alloy_pkg.stdout | default('unknown') | trim }}"
          config_sha256: "{{ (_alloy_config.stdout | default('')).split(' ') | first }}"
          journal_member: "{{ 'systemd-journal' in (_alloy_groups.stdout | default('')).split() }}"
          service_enabled: "{{ _alloy_enabled.rc | default(1) == 0 }}"
          service_active: "{{ _alloy_active.rc | default(1) == 0 }}"
        aggregate: false
      changed_when: false
      check_mode: false
