---
# Sends the pre-rendered briefing via a single notifier. Included in a loop from
# Phase 4 with loop_var `notifier`. Each block is gated on notifier.type + enabled.
# The body (_briefing_body) is identical across notifiers — only the transport
# envelope differs.
- name: "Notify via Discord"
  uri:
    url: "{{ notifier.webhook }}"
    method: POST
    headers:
      Content-Type: "application/json"
    body: "{{ {'embeds': [{'title': _briefing_title, 'description': _briefing_body, 'color': _discord_color}]} | to_json }}"
    status_code: [200, 204, 429, 500, 502, 503, 504]
  register: discord_response
  until: "discord_response.status in [200, 204]"
  retries: 15
  delay: 10
  ignore_errors: yes
  check_mode: no
  when:
    - notifier.enabled | default(true) | bool
    - notifier.type == 'discord'

- name: "Notify via ntfy"
  uri:
    url: "{{ notifier.url }}"
    method: POST
    headers: >-
      {{ {'Title': _ntfy_title,
          'Priority': (notifier.priority | default(5 if fleet_failed | default(false) else 3)) | string,
          'Tags': (notifier.tags | default('warning' if fleet_failed | default(false) else 'white_check_mark')),
          'Markdown': 'yes'}
         | combine({'Authorization': 'Bearer ' ~ notifier.token}
                   if (notifier.token is defined and notifier.token | default('') | trim != '') else {}) }}
    body: "{{ _briefing_body }}"
    status_code: [200, 429, 500, 502, 503, 504]
  register: ntfy_response
  until: "ntfy_response.status == 200"
  retries: 15
  delay: 10
  ignore_errors: yes
  check_mode: no
  when:
    - notifier.enabled | default(true) | bool
    - notifier.type == 'ntfy'
