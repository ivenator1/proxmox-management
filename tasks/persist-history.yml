---
# Persists a JSON summary of this run to fleet_history_dir on the manager:
# a timestamped run-<ts>.json plus an overwritten latest.json. Runs on localhost
# in Phase 4. There is no in-memory history otherwise — facts die with the play.
- name: "Resolve run timestamp"
  set_fact:
    _run_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
  check_mode: no

- name: "Build run summary"
  set_fact:
    _run_summary:
      timestamp: "{{ _run_ts }}"
      changed: "{{ fleet_changed | default(false) | bool }}"
      failed: "{{ fleet_failed | default(false) | bool }}"
      counts:
        lxc: "{{ (fleet_lxc_data | default([])) | length }}"
        vm: "{{ (fleet_vm_data | default([])) | length }}"
        remote: "{{ (fleet_remote_data | default([])) | length }}"
        node: "{{ (fleet_node_data | default([])) | length }}"
        custom: "{{ (fleet_custom_data | default([])) | length }}"
        errors: "{{ (fleet_error_log | default([])) | length }}"
        warnings: "{{ (fleet_warning_log | default([])) | length }}"
      lxc: "{{ fleet_lxc_data | default([]) }}"
      vm: "{{ fleet_vm_data | default([]) }}"
      remote: "{{ fleet_remote_data | default([]) }}"
      node: "{{ fleet_node_data | default([]) }}"
      custom: "{{ fleet_custom_data | default([]) }}"
      errors: "{{ fleet_error_log | default([]) }}"
      warnings: "{{ fleet_warning_log | default([]) }}"
  check_mode: no

- name: "Ensure history directory exists"
  file:
    path: "{{ fleet_history_dir | default('/var/log/fleet-update') }}"
    state: directory
    mode: '0755'
  check_mode: no

- name: "Write run history files"
  copy:
    dest: "{{ fleet_history_dir | default('/var/log/fleet-update') }}/{{ item }}"
    content: "{{ _run_summary | to_nice_json }}"
    mode: '0644'
  loop:
    - "run-{{ _run_ts }}.json"
    - "latest.json"
  check_mode: no

- name: "Prune old run history (keep newest {{ fleet_history_keep | default(30) }})"
  shell: >
    ls -1t "{{ fleet_history_dir | default('/var/log/fleet-update') }}"/run-*.json 2>/dev/null
    | tail -n +{{ (fleet_history_keep | default(30) | int) + 1 }}
    | xargs -r rm -f
  changed_when: false
  when: (fleet_history_keep | default(30) | int) > 0
  check_mode: no
