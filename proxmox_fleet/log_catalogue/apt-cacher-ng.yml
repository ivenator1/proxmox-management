        app: apt-cacher-ng
        log_kind: access
        allowed_roots:
          - /var/log/apt-cacher-ng
        paths:
          - /var/log/apt-cacher-ng/apt-cacher.log
      - id: error
        app: apt-cacher-ng
        log_kind: error
        allowed_roots:
          - /var/log/apt-cacher-ng
        paths:
          - /var/log/apt-cacher-ng/apt-cacher.err
      - id: debug
        app: apt-cacher-ng
        log_kind: debug
        allowed_roots:
          - /var/log/apt-cacher-ng
        paths:
          - /var/log/apt-cacher-ng/apt-cacher.dbg
        required: false
