<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fleet Dashboard{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b0e14'/%3E%3Cpath d='M6 16.5 12 5l6 11.5' fill='none' stroke='%236c9ef8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='12' cy='14' r='1.8' fill='%233fb96f'/%3E%3C/svg%3E">
  <script>
    /* pre-paint theme restore — avoids a flash of the wrong theme */
    (function () {
      try {
        var t = localStorage.getItem("fleet-theme");
        if (!t && window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Fleet Dashboard home">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="5" fill="var(--accent-dim)"/>
          <path d="M6 16.5 12 5l6 11.5" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="14" r="1.8" fill="var(--ok)"/>
        </svg>
        <span class="brand-name">Fleet Dashboard</span>
      </a>
      {% set path = request.url.path %}
      <nav class="nav-links">
        <a href="/" {% if path == "/" %}class="active"{% endif %}>Overview</a>
        <a href="/pending" {% if path.startswith("/pending") %}class="active"{% endif %}>Pending</a>
        <a href="/history" {% if path.startswith("/history") %}class="active"{% endif %}>History</a>
        <a href="/trigger" {% if path.startswith("/trigger") or path.startswith("/runs") %}class="active"{% endif %}>Trigger</a>
        <a href="/inventory" {% if path.startswith("/inventory") or path.startswith("/ssh") %}class="active"{% endif %}>Inventory</a>
        <a href="/settings" {% if path.startswith("/settings") %}class="active"{% endif %}>Settings</a>
      </nav>
      <div class="nav-actions">
        <span class="kbd-hint" title="Command palette (ctrl+K or /)">⌃K</span>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme (t)">
          <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
          </svg>
          <svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>Fleet Dashboard — reads run history only; never reaches the fleet.</span>
    <span class="muted">press <code>?</code> for shortcuts</span>
  </footer>
  <script type="application/json" id="palette-data">{{ palette_items() | tojson }}</script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
