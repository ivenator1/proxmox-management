[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-fleet"
version = "0.1.0"
description = "Typed-Python control plane for the proxmox-management fleet updater. Ansible is the execution layer; Python owns all logic."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
]

# ansible-runner is only needed when actually driving real plays on the manager.
# Unit tests + type-checking do not require it, so it is an optional extra.
[project.optional-dependencies]
runner = ["ansible-runner>=2.3"]
dev = [
    "mypy>=1.8",
    "pytest>=7",
    "pyyaml>=6",
    "pydantic>=2,<3",
]

[project.scripts]
fleet-update = "proxmox_fleet.cli:main"

[tool.setuptools.packages.find]
include = ["proxmox_fleet*"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ansible_runner.*"]
ignore_missing_imports = true
