[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-fleet"
version = "0.1.0"
description = "Typed-Python control plane for the proxmox-management fleet updater. Ansible is the execution layer; Python owns all logic."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
    "jinja2>=3",
    "ansible-runner>=2.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=7",
    "pyyaml>=6",
    "types-PyYAML",
    "pydantic>=2,<3",
    "ruff>=0.4",
    # web extra mirrored here so mypy/tests cover proxmox_fleet/web in CI
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "python-multipart>=0.0.7",
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
    "fastapi-users[sqlalchemy,bcrypt]>=12",
    "sqlalchemy>=2",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "python-multipart>=0.0.7",  # starlette form parsing (the trigger form)
    "ruamel.yaml>=0.18",        # comment-preserving vars.yml edits (settings/enroll pages)
    "fastapi-users[sqlalchemy,bcrypt]>=12",  # session auth, user management, password hashing
    "sqlalchemy>=2",            # ORM for user database
]

[project.scripts]
fleet-update = "proxmox_fleet.cli:main"
fleet-dashboard = "proxmox_fleet.web.main:main"

[tool.setuptools.packages.find]
include = ["proxmox_fleet*"]

[tool.setuptools.package-data]
"proxmox_fleet.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# F = pyflakes (unused imports/vars, undefined names), E = pycodestyle errors.
select = ["F", "E"]
# E501 (line length) is advisory here; line-length above keeps it reasonable.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ansible_runner.*"]
ignore_missing_imports = true
