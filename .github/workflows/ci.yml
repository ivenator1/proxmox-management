---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint .

  lint-ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible-lint
        run: pip install ansible-lint
      - name: Install collections
        run: ansible-galaxy collection install community.proxmox community.general
      - name: Create stub vars.yml for linting
        run: cp vars.yml.example vars.yml
      - name: Run ansible-lint
        run: ansible-lint fleet-update.yml

  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible
        run: pip install ansible
      - name: Install collections
        run: ansible-galaxy collection install community.proxmox community.general
      - name: Create stub inventory and vars
        run: |
          cp vars.yml.example vars.yml
          cp hosts.ini.example hosts.ini
      - name: Syntax check
        run: ansible-playbook fleet-update.yml --syntax-check

  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Install proxmox_fleet package
        run: pip install -e .
      - name: Run pytest
        run: pytest tests/unit/ -v --tb=short

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Run mypy
        run: python -m mypy proxmox_fleet/

  molecule-lxc-update:
    name: Molecule — lxc_update ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - lxc_update_normal
          - lxc_update_rollback
          - lxc_update_snapfail
    steps:
      - uses: actions/checkout@v4
      - name: Install molecule and ansible
        run: pip install molecule ansible
      - name: Install collections
        run: ansible-galaxy collection install community.proxmox community.general
      - name: Run molecule scenario
        run: molecule test -s ${{ matrix.scenario }}
        working-directory: roles/lxc_update

  molecule-custom-update:
    name: Molecule — custom_update ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - custom_update_normal
          - custom_update_noop
          - custom_update_rescue
          - custom_update_dry_run
          - custom_update_uptodate
          - custom_update_per_step
    steps:
      - uses: actions/checkout@v4
      - name: Install molecule and ansible
        run: pip install molecule ansible
      - name: Run molecule scenario
        run: molecule test -s ${{ matrix.scenario }}
        working-directory: roles/custom_update
