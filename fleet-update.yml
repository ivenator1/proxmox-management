---
# ==========================================
# PRE-FLIGHT: PROXY CHECK
# ==========================================
- name: "Pre-Flight: Check Apt Proxy"
  hosts: localhost
  connection: local
  vars_files: [vars.yml]
  tasks:
    - name: "Verify Apt-Cacher-NG is Online"
      wait_for:
        host: "{{ apt_proxy_ip }}"
        port: "{{ apt_proxy_port }}"
        state: started
        timeout: 30
      register: proxy_check
      ignore_errors: yes

    - name: "Halt if Proxy is Offline"
      fail:
        msg: "CRITICAL: Apt Proxy ({{ apt_proxy_ip }}) is unreachable. Aborting fleet update."
      when: proxy_check is failed

# ==========================================
# PHASE 0: Remote Host Updates
# Skipped when skip_phase_0=true (Python driver ran Phase 0 instead).
# ==========================================
- name: "Phase 0: Remote Host Updates"
  hosts: remote_hosts
  serial: 2
  gather_facts: yes
  vars_files: [vars.yml]
  tasks:
    - name: "Run remote host update"
      when: not (skip_phase_0 | default(false) | bool)
      block:
        - name: "Apply fleet-wide dry-run"
          set_fact:
            remote_dry_run: "{{ (fleet_dry_run | default(false) | bool) or (remote_dry_run | default(false) | bool) }}"

        - name: "Update remote host"
          include_role:
            name: remote_host_update

# When skip_phase_0=true the Python driver wrote fleet_remote_data etc. to a
# JSON file; load it into localhost facts here so Phase 0a–4 fleet-state-append
# calls OR-join against the already-seeded fleet_changed/fleet_failed values.
- name: "Merge Python remote state into fleet"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Load Python remote state"
      include_vars:
        file: "{{ fleet_remote_state_path }}"
        name: _pyremote
      when: fleet_remote_state_path is defined

    - name: "Seed fleet remote state from Python driver"
      set_fact:
        fleet_remote_data: "{{ _pyremote.fleet_remote_data | default([]) }}"
        fleet_changed: "{{ (fleet_changed | default(false)) or (_pyremote.fleet_changed | default(false)) }}"
        fleet_failed: "{{ (fleet_failed | default(false)) or (_pyremote.fleet_failed | default(false)) }}"
        fleet_error_log: "{{ (fleet_error_log | default([])) + (_pyremote.fleet_error_log | default([])) }}"
        fleet_warning_log: "{{ (fleet_warning_log | default([])) + (_pyremote.fleet_warning_log | default([])) }}"
      when: fleet_remote_state_path is defined

# ==========================================
# PHASE 0a: Validate custom dependency ordering
# ==========================================
- name: "Phase 0a: Validate Custom Dependencies"
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    - name: "Compute dependency-order problems"
      set_fact:
        _dep_problems: >-
          {%- set chosts = groups['custom_hosts'] | default([]) -%}
          {%- set probs = [] -%}
          {%- for h in chosts -%}
          {%- for d in hostvars[h].depends_on | default([]) -%}
          {%- if d not in chosts -%}
          {%- set _ = probs.append(h ~ ' depends_on missing custom host ' ~ d) -%}
          {%- elif chosts.index(d) > chosts.index(h) -%}
          {%- set _ = probs.append(h ~ ' depends_on ' ~ d ~ ' which is listed AFTER it; reorder [custom_hosts] so dependencies come first') -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ probs }}
      when: (groups['custom_hosts'] | default([])) | length > 0

    - name: "Fail on dependency-order problems"
      assert:
        that:
          - (_dep_problems | default([])) | length == 0
        fail_msg: "Custom dependency problems: {{ _dep_problems | default([]) | join('; ') }}"
        success_msg: "Custom dependency order OK."
        quiet: true
      when: (groups['custom_hosts'] | default([])) | length > 0

# ==========================================
# PHASE 0b: Custom (non-standard) system updates
# Skipped when skip_phase_0b=true (Python driver ran Phase 0b instead).
# ==========================================
- name: "Phase 0b: Custom System Updates"
  hosts: custom_hosts
  serial: 1
  gather_facts: yes
  vars_files: [vars.yml]
  tasks:
    - name: "Run custom system update"
      when: not (skip_phase_0b | default(false) | bool)
      block:
        - name: "Apply fleet-wide dry-run"
          set_fact:
            custom_dry_run: "{{ (fleet_dry_run | default(false) | bool) or (custom_dry_run | default(false) | bool) }}"

        - name: "Update custom system"
          include_role:
            name: custom_update

# When skip_phase_0b=true the Python driver wrote fleet_custom_data etc. to a
# JSON file; load it into localhost facts here so Phases 1–3 fleet-state-append
# calls OR-join against the already-seeded fleet_changed/fleet_failed values.
- name: "Merge Python custom state into fleet"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Load Python custom state"
      include_vars:
        file: "{{ fleet_custom_state_path }}"
        name: _py
      when: fleet_custom_state_path is defined

    - name: "Seed fleet state from Python driver"
      set_fact:
        fleet_custom_data: "{{ _py.fleet_custom_data | default([]) }}"
        fleet_changed: "{{ _py.fleet_changed | default(false) | bool }}"
        fleet_failed: "{{ _py.fleet_failed | default(false) | bool }}"
        fleet_error_log: "{{ _py.fleet_error_log | default([]) }}"
        fleet_warning_log: "{{ _py.fleet_warning_log | default([]) }}"
      when: fleet_custom_state_path is defined

# ==========================================
# PHASE 1: Update all tagged LXCs
# Skipped when skip_phase_1=true (Python driver ran Phase 1 instead).
# ==========================================
- name: "Phase 1: Update All LXCs"
  hosts: proxmox_nodes
  serial: 2
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    - name: "Run LXC updates"
      when: not (skip_phase_1 | default(false) | bool)
      block:
        - name: "Apply fleet-wide dry-run"
          set_fact:
            lxc_dry_run: "{{ (fleet_dry_run | default(false) | bool) or (lxc_dry_run | default(false) | bool) }}"

        - name: "Discover tagged LXCs"
          shell: |
            pct list | awk 'NR>1 {print $1}' | while read id; do
              pct config "$id" 2>/dev/null \
                | grep -qE '^tags:.*({{ lxc_tags | join("|") }})' && echo "$id"
            done
          register: lxc_list
          check_mode: false
          changed_when: false

        - name: "Update LXCs"
          include_role:
            name: lxc_update
          vars:
            lxc_id: "{{ item }}"
          loop: "{{ lxc_list.stdout_lines | difference(exclude_list | default([])) }}"
          ignore_errors: "{{ lxc_continue_on_error | default(false) | bool }}"

# When skip_phase_1=true the Python driver wrote fleet_lxc_data etc. to a
# JSON file; load it into localhost facts here so Phases 1b–3 fleet-state-append
# calls OR-join against the already-seeded fleet_changed/fleet_failed values.
- name: "Merge Python lxc state into fleet"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Load Python lxc state"
      include_vars:
        file: "{{ fleet_lxc_state_path }}"
        name: _pylxc
      when: fleet_lxc_state_path is defined

    - name: "Seed fleet lxc state from Python driver"
      set_fact:
        fleet_lxc_data: "{{ _pylxc.fleet_lxc_data | default([]) }}"
        fleet_changed: "{{ (fleet_changed | default(false)) or (_pylxc.fleet_changed | default(false)) }}"
        fleet_failed: "{{ (fleet_failed | default(false)) or (_pylxc.fleet_failed | default(false)) }}"
        fleet_error_log: "{{ (fleet_error_log | default([])) + (_pylxc.fleet_error_log | default([])) }}"
        fleet_warning_log: "{{ (fleet_warning_log | default([])) + (_pylxc.fleet_warning_log | default([])) }}"
      when: fleet_lxc_state_path is defined

# ==========================================
# PHASE 1b: VM Updates
# Skipped when skip_phase_1b=true (Python driver ran Phase 1b instead).
# ==========================================
- name: "Phase 1b: VM Updates"
  hosts: proxmox_vms
  serial: 2
  gather_facts: yes
  vars_files: [vars.yml]
  tasks:
    - name: "Run VM update"
      when: not (skip_phase_1b | default(false) | bool)
      block:
        - name: "Apply fleet-wide dry-run"
          set_fact:
            vm_dry_run: "{{ (fleet_dry_run | default(false) | bool) or (vm_dry_run | default(false) | bool) }}"

        - name: "Update VM"
          include_role:
            name: vm_update

# When skip_phase_1b=true the Python driver wrote fleet_vm_data etc. to a
# JSON file; load it into localhost facts here so Phases 2–4 fleet-state-append
# calls OR-join against the already-seeded fleet_changed/fleet_failed values.
- name: "Merge Python VM state into fleet"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Load Python VM state"
      include_vars:
        file: "{{ fleet_vm_state_path }}"
        name: _pyvm
      when: fleet_vm_state_path is defined

    - name: "Seed fleet VM state from Python driver"
      set_fact:
        fleet_vm_data: "{{ _pyvm.fleet_vm_data | default([]) }}"
        fleet_changed: "{{ (fleet_changed | default(false)) or (_pyvm.fleet_changed | default(false)) }}"
        fleet_failed: "{{ (fleet_failed | default(false)) or (_pyvm.fleet_failed | default(false)) }}"
        fleet_error_log: "{{ (fleet_error_log | default([])) + (_pyvm.fleet_error_log | default([])) }}"
        fleet_warning_log: "{{ (fleet_warning_log | default([])) + (_pyvm.fleet_warning_log | default([])) }}"
      when: fleet_vm_state_path is defined

# When skip_phase_2=true the Python driver wrote fleet_node_data etc. to a JSON
# file; load it into localhost facts here so Phase 4 fleet-state-append calls
# OR-join against the already-seeded fleet_changed/fleet_failed values.
- name: "Merge Python node state into fleet"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: "Load Python node state"
      include_vars:
        file: "{{ fleet_node_state_path }}"
        name: _pynode
      when: fleet_node_state_path is defined

    - name: "Seed fleet node state from Python driver"
      set_fact:
        fleet_node_data: "{{ _pynode.fleet_node_data | default([]) }}"
        fleet_changed: "{{ (fleet_changed | default(false)) or (_pynode.fleet_changed | default(false)) }}"
        fleet_failed: "{{ (fleet_failed | default(false)) or (_pynode.fleet_failed | default(false)) }}"
        fleet_error_log: "{{ (fleet_error_log | default([])) + (_pynode.fleet_error_log | default([])) }}"
        fleet_warning_log: "{{ (fleet_warning_log | default([])) + (_pynode.fleet_warning_log | default([])) }}"
      when: fleet_node_state_path is defined

# ============================================
# PHASE 2: Update Nodes and reboot if needed
# Skipped when skip_phase_2=true (Python driver ran Phase 2 instead).
# ============================================
- name: "Phase 2: Node Updates & Reboots"
  hosts: proxmox_nodes
  serial: 1
  any_errors_fatal: true
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    - name: "Node Maintenance Block"
      when: not (skip_phase_2 | default(false) | bool)
      block:
        - name: "Identify if this is the Manager Host"
          shell: "pct list | grep -q '^{{ manager_lxc_id }} ' && echo 'yes' || echo 'no'"
          register: is_manager_host
          changed_when: false

        - name: "Update Host OS"
          apt:
            upgrade: dist
            update_cache: yes
            autoremove: yes
          register: host_apt
          retries: 5
          delay: 30
          until: host_apt is succeeded
          changed_when:
            - host_apt is succeeded
            - host_apt.stdout is defined
            - "'0 upgraded, 0 newly installed' not in host_apt.stdout"

        - name: "Robust Reboot Check"
          shell: |
            RUNNING=$(uname -r); LATEST=$(ls -1 /boot/vmlinuz-* | sort -V | tail -n 1 | sed 's|.*vmlinuz-||')
            if [ -f /var/run/reboot-required ] || [ "$RUNNING" != "$LATEST" ]; then echo "reboot"; else echo "ok"; fi
          register: reboot_decision
          changed_when: false

        - name: "Reboot Node"
          reboot:
            reboot_timeout: 900
            post_reboot_delay: 60
          when:
            - "'reboot' in reboot_decision.stdout"
            - "'yes' not in is_manager_host.stdout"
          register: node_reboot

        - name: "Wait for Apt Proxy after Node Reboot"
          wait_for:
            host: "{{ apt_proxy_ip }}"
            port: "{{ apt_proxy_port }}"
            state: started
            timeout: 300
          delegate_to: localhost
          when: node_reboot.changed

        - name: "Proxy Settle Pause"
          pause:
            seconds: 15
          when: node_reboot.changed

        - name: "Set reboot flags"
          set_fact:
            needs_reboot_flag: "{{ 'reboot' in reboot_decision.stdout }}"
            is_manager_flag: "{{ 'yes' in is_manager_host.stdout }}"

        - name: "Calculate Node Status String"
          set_fact:
            node_status_str: >-
              {% if node_reboot is defined and node_reboot.changed %}UPDATED & REBOOTED
              {% elif needs_reboot_flag and is_manager_flag %}UPDATED (MANUAL REBOOT REQ)
              {% elif needs_reboot_flag and not is_manager_flag %}REBOOT FAILED
              {% elif host_apt.changed %}UPDATED
              {% else %}OK{% endif %}

        - name: "Record Node Status"
          include_tasks: tasks/fleet-state-append.yml
          vars:
            fleet_record_type: node
            fleet_record_payload:
              node: "{{ inventory_hostname }}"
              status: "{{ node_status_str | trim }}"
            fleet_record_changed: >-
              {{ host_apt.changed or
                 (node_reboot is defined and node_reboot.changed) or
                 (needs_reboot_flag and is_manager_flag) }}

      rescue:
        - name: "Capture node failure details"
          set_fact:
            _failed_task_name: "{{ ansible_failed_task.name | default('Unknown task') }}"
            _failed_error: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg) | default('Unknown error') | truncate(300) }}"

        - name: "Record Node Failure"
          include_tasks: tasks/fleet-state-append.yml
          vars:
            fleet_record_type: node
            fleet_record_payload:
              node: "{{ inventory_hostname }}"
              status: "FAILED"
            fleet_record_failed: true
            fleet_error_detail:
              host: "{{ inventory_hostname }}"
              task: "{{ _failed_task_name }}"
              error: "{{ _failed_error }}"

# ==========================================
# PHASE 3: MANAGER SELF-UPDATE (Local)
# Skipped when skip_phase_3=true (Python driver ran Phase 3 instead).
# ==========================================
- name: "Phase 3: Manager Self-Update"
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    - name: "Manager Self-Update Block"
      when: not (skip_phase_3 | default(false) | bool)
      block:
        - name: "Update Manager OS Packages"
          apt:
            upgrade: dist
            update_cache: yes
            autoremove: yes
          register: manager_apt
          ignore_errors: yes

        - name: "Check if Manager Needs Reboot"
          stat:
            path: /var/run/reboot-required
          register: manager_reboot_file

        - name: "Record Manager Status"
          include_tasks: tasks/fleet-state-append.yml
          vars:
            fleet_record_type: manager
            fleet_record_payload:
              node: "Ansible-Manager"
              status: "{{ 'UPDATED (MANUAL REBOOT REQ)' if manager_reboot_file.stat.exists else 'UPDATED' if manager_apt.changed else 'OK' }}"
            fleet_record_changed: "{{ manager_apt.changed }}"

# ==========================================
# PHASE 4: FINAL BRIEFING
# ==========================================
- name: "Phase 4: Final Briefing"
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    # Legacy Phase 4. Skipped when the Python notify flow owns it
    # (--use-notify-flow sets skip_phase_4=true); the dump task below then hands
    # the merged fleet state to the Python driver, which runs after the playbook.
    - name: "Legacy Phase 4 briefing / history / notifiers"
      when: not (skip_phase_4 | default(false) | bool)
      block:
        - name: "Build briefing payload"
          set_fact:
            # _discord_color / _briefing_title kept identical to the previous behaviour.
            _discord_color: "{{ (15158332 if fleet_failed | default(false) else 3066993) | int }}"
            _briefing_title: "{% if fleet_failed | default(false) %}⚠️ Briefing: Failures Detected{% else %}✅ Briefing: All Systems Clear{% endif %}"
            # Plain (ASCII-safe) title for the ntfy 'Title' HTTP header.
            _ntfy_title: "{% if fleet_failed | default(false) %}Fleet Update: Failures Detected{% else %}Fleet Update: All Systems Clear{% endif %}"
            # Canonical rendered body — shared verbatim by every notifier.
            _briefing_body: "{{ lookup('template', 'templates/discord_briefing.j2') | trim | truncate(4000, False, '\n...') }}"
            _should_notify: "{{ (force_notify | default(false) | bool) or (fleet_dry_run | default(false) | bool) or (fleet_changed | default(false)) or (fleet_failed | default(false)) }}"
          check_mode: no

        - name: "Persist run history"
          include_tasks: tasks/persist-history.yml
          when: fleet_history_enabled | default(true) | bool

        - name: "Resolve notifier list (back-compat shim for discord_webhook)"
          set_fact:
            _notifiers: >-
              {{ notifiers if notifiers is defined
                 else ([{'type': 'discord', 'enabled': true, 'webhook': discord_webhook}]
                       if (discord_webhook is defined and discord_webhook | default('') | trim != '')
                       else []) }}
          check_mode: no

        - name: "Dispatch briefing to notifiers"
          include_tasks: tasks/notify.yml
          loop: "{{ _notifiers }}"
          loop_control:
            loop_var: notifier
            label: "{{ notifier.type }}"
          when: _should_notify | bool

        # Dead-man's-switch: ping a monitor so its ABSENCE alerts you when the whole
        # orchestrator silently stops running (healthchecks.io convention: /fail on failure).
        - name: "Ping dead-man's-switch"
          uri:
            url: "{{ fleet_deadmans_url ~ ('/fail' if (fleet_failed | default(false)) else '') }}"
            method: GET
            status_code: [200, 201, 202, 204]
          register: _deadmans_res
          until: "_deadmans_res.status in [200, 201, 202, 204]"
          retries: 5
          delay: 10
          ignore_errors: yes
          check_mode: no
          when: fleet_deadmans_url is defined and fleet_deadmans_url | default('') | trim != ''

    # --use-notify-flow: dump the merged fleet_* facts so the Python notify phase
    # (briefing/history/notifiers) can render and dispatch them after the playbook.
    - name: "Dump merged fleet state for Python notify phase"
      when: skip_phase_4 | default(false) | bool
      copy:
        dest: "{{ fleet_final_state_path }}"
        mode: '0644'
        content: "{{ {
            'fleet_lxc_data': fleet_lxc_data | default([]),
            'fleet_vm_data': fleet_vm_data | default([]),
            'fleet_remote_data': fleet_remote_data | default([]),
            'fleet_node_data': fleet_node_data | default([]),
            'fleet_custom_data': fleet_custom_data | default([]),
            'fleet_error_log': fleet_error_log | default([]),
            'fleet_warning_log': fleet_warning_log | default([]),
            'fleet_changed': fleet_changed | default(false),
            'fleet_failed': fleet_failed | default(false)
          } | to_nice_json }}"
      check_mode: no
