---
# ==========================================
# PRE-FLIGHT: PROXY CHECK
# ==========================================
- name: "Pre-Flight: Check Apt Proxy"
  hosts: localhost
  connection: local
  vars_files: [vars.yml]
  tasks:
    - name: "Verify Apt-Cacher-NG is Online"
      wait_for:
        host: "{{ apt_proxy_ip }}"
        port: "{{ apt_proxy_port }}"
        state: started
        timeout: 30
      register: proxy_check
      ignore_errors: yes

    - name: "Halt if Proxy is Offline"
      fail:
        msg: "CRITICAL: Apt Proxy ({{ apt_proxy_ip }}) is unreachable. Aborting fleet update."
      when: proxy_check is failed

# ==========================================
# PHASE 0: Remote Host Updates
# ==========================================
- name: "Phase 0: Remote Host Updates"
  hosts: remote_hosts
  serial: 2
  gather_facts: yes
  vars_files: [vars.yml]
  tasks:
    - name: "Update remote host"
      include_role:
        name: remote_host_update

# ==========================================
# PHASE 1: Update all tagged LXCs
# ==========================================
- name: "Phase 1: Update All LXCs"
  hosts: proxmox_nodes
  serial: 2
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    - name: "Discover tagged LXCs"
      shell: |
        pct list | awk 'NR>1 {print $1}' | while read id; do
          pct config "$id" 2>/dev/null \
            | grep -qE '^tags:.*({{ lxc_tags | join("|") }})' && echo "$id"
        done
      register: lxc_list
      check_mode: false
      changed_when: false

    - name: "Update LXCs"
      include_role:
        name: lxc_update
      vars:
        lxc_id: "{{ item }}"
      loop: "{{ lxc_list.stdout_lines | difference(exclude_list | default([])) }}"
      ignore_errors: "{{ lxc_continue_on_error | default(false) | bool }}"

# ==========================================
# PHASE 1b: VM Updates
# ==========================================
- name: "Phase 1b: VM Updates"
  hosts: proxmox_vms
  serial: 2
  gather_facts: yes
  vars_files: [vars.yml]
  tasks:
    - name: "Update VM"
      include_role:
        name: vm_update

# ============================================
# PHASE 2: Update Nodes and reboot if needed
# ============================================
- name: "Phase 2: Node Updates & Reboots"
  hosts: proxmox_nodes
  serial: 1
  any_errors_fatal: true
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    - name: "Node Maintenance Block"
      block:
        - name: "Identify if this is the Manager Host"
          shell: "pct list | grep -q '^{{ manager_lxc_id }} ' && echo 'yes' || echo 'no'"
          register: is_manager_host
          changed_when: false

        - name: "Update Host OS"
          apt:
            upgrade: dist
            update_cache: yes
            autoremove: yes
          register: host_apt
          retries: 5
          delay: 30
          until: host_apt is succeeded
          changed_when:
            - host_apt is succeeded
            - host_apt.stdout is defined
            - "'0 upgraded, 0 newly installed' not in host_apt.stdout"

        - name: "Robust Reboot Check"
          shell: |
            RUNNING=$(uname -r); LATEST=$(ls -1 /boot/vmlinuz-* | sort -V | tail -n 1 | sed 's|.*vmlinuz-||')
            if [ -f /var/run/reboot-required ] || [ "$RUNNING" != "$LATEST" ]; then echo "reboot"; else echo "ok"; fi
          register: reboot_decision
          changed_when: false

        - name: "Reboot Node"
          reboot:
            reboot_timeout: 900
            post_reboot_delay: 60
          when:
            - "'reboot' in reboot_decision.stdout"
            - "'yes' not in is_manager_host.stdout"
          register: node_reboot

        - name: "Wait for Apt Proxy after Node Reboot"
          wait_for:
            host: "{{ apt_proxy_ip }}"
            port: "{{ apt_proxy_port }}"
            state: started
            timeout: 300
          delegate_to: localhost
          when: node_reboot.changed

        - name: "Proxy Settle Pause"
          pause:
            seconds: 15
          when: node_reboot.changed

        - name: "Set reboot flags"
          set_fact:
            needs_reboot_flag: "{{ 'reboot' in reboot_decision.stdout }}"
            is_manager_flag: "{{ 'yes' in is_manager_host.stdout }}"

        - name: "Calculate Node Status String"
          set_fact:
            node_status_str: >-
              {% if node_reboot is defined and node_reboot.changed %}UPDATED & REBOOTED
              {% elif needs_reboot_flag and is_manager_flag %}UPDATED (MANUAL REBOOT REQ)
              {% elif needs_reboot_flag and not is_manager_flag %}REBOOT FAILED
              {% elif host_apt.changed %}UPDATED
              {% else %}OK{% endif %}

        - name: "Record Node Status"
          include_tasks: tasks/fleet-state-append.yml
          vars:
            fleet_record_type: node
            fleet_record_payload:
              node: "{{ inventory_hostname }}"
              status: "{{ node_status_str | trim }}"
            fleet_record_changed: >-
              {{ host_apt.changed or
                 (node_reboot is defined and node_reboot.changed) or
                 (needs_reboot_flag and is_manager_flag) }}

      rescue:
        - name: "Capture node failure details"
          set_fact:
            _failed_task_name: "{{ ansible_failed_task.name | default('Unknown task') }}"
            _failed_error: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg) | default('Unknown error') | truncate(300) }}"

        - name: "Record Node Failure"
          include_tasks: tasks/fleet-state-append.yml
          vars:
            fleet_record_type: node
            fleet_record_payload:
              node: "{{ inventory_hostname }}"
              status: "FAILED"
            fleet_record_failed: true
            fleet_error_detail:
              host: "{{ inventory_hostname }}"
              task: "{{ _failed_task_name }}"
              error: "{{ _failed_error }}"

# ==========================================
# PHASE 3: MANAGER SELF-UPDATE (Local)
# ==========================================
- name: "Phase 3: Manager Self-Update"
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    - name: "Update Manager OS Packages"
      apt:
        upgrade: dist
        update_cache: yes
        autoremove: yes
      register: manager_apt
      ignore_errors: yes

    - name: "Check if Manager Needs Reboot"
      stat:
        path: /var/run/reboot-required
      register: manager_reboot_file

    - name: "Record Manager Status"
      include_tasks: tasks/fleet-state-append.yml
      vars:
        fleet_record_type: manager
        fleet_record_payload:
          node: "Ansible-Manager"
          status: "{{ 'UPDATED (MANUAL REBOOT REQ)' if manager_reboot_file.stat.exists else 'UPDATED' if manager_apt.changed else 'OK' }}"
        fleet_record_changed: "{{ manager_apt.changed }}"

# ==========================================
# PHASE 4: FINAL BRIEFING
# ==========================================
- name: "Phase 4: Final Briefing"
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: [vars.yml]
  tasks:
    - name: "Send Final Discord Briefing"
      vars:
        should_notify: "{{ (force_notify | default(false) | bool) or (fleet_changed | default(false)) or (fleet_failed | default(false)) }}"
        briefing_body: "{{ lookup('template', 'templates/discord_briefing.j2') }}"
      when: should_notify
      uri:
        url: "{{ discord_webhook }}"
        method: POST
        body_format: json
        body:
          embeds:
            - title: "{% if fleet_failed | default(false) %}⚠️ Briefing: Failures Detected{% else %}✅ Briefing: All Systems Clear{% endif %}"
              description: "{{ briefing_body }}"
              color: "{{ 15158332 if fleet_failed | default(false) else 3066993 }}"
        status_code: [200, 204, 429, 500, 502, 503, 504]
      register: discord_response
      until: "discord_response.status in [200, 204]"
      retries: 15
      delay: 10
      ignore_errors: yes
      check_mode: no
