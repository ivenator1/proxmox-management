---
# strategy=none → no snapshot; kuma URL unreachable → HealthCheckError → rescue
# The OS update reports 1 upgraded which gates the Kuma health check.
# Rollback is NOT attempted because no snapshot was taken (strategy=none).
- name: Converge — lxc_update rollback (no snapshot, Kuma unreachable → FAILED)
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    PATH: "/tmp/mol_stubs:{{ lookup('env', 'PATH') }}"
  tasks:
    - name: Run flow via Python (RunnerExecutor path)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../mol_run_flow.py"
          - "--lxc-id=101"
          - "--node=pve-01"
          - "--host=localhost"
          - "--inventory=/tmp/mol_hosts.ini"
          - "--state-out=/tmp/mol_fleet_state.json"
          - "--strategy=none"
          - "--kuma-url=http://127.0.0.1:9999/unreachable"
          - "--kuma-monitor-id=5"
