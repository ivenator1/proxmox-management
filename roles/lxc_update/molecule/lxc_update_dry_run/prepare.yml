---
- name: Create stubs for dry-run scenario
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create stubs directory
      file:
        path: /tmp/mol_stubs
        state: directory
        mode: '0755'

    - name: Remove stale state files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/mol_dryrun_update_called
        - /tmp/mol_dryrun_vzdump_called

    - name: Write pct stub
      copy:
        dest: /tmp/mol_stubs/pct
        mode: '0755'
        content: |
          #!/bin/bash
          CMD="$1"; shift
          case "$CMD" in
            config)
              echo "arch: amd64"
              echo "hostname: sonarr"
              echo "ostype: ubuntu"
              echo "cores: 2"
              echo "memory: 2048"
              echo "tags: community-script"
              ;;
            status)
              echo "status: running"
              ;;
            pull)
              # No update script — leads to lxc_no_update_script: true
              # dry_check will then produce dry_run_status='no ver info'
              exit 1
              ;;
            exec)
              # Any exec call in dry-run mode would be unexpected
              touch /tmp/mol_dryrun_update_called
              exit 0
              ;;
            set) exit 0 ;;
          esac

    - name: Write vzdump stub (should NOT be called in dry-run)
      copy:
        dest: /tmp/mol_stubs/vzdump
        mode: '0755'
        content: |
          #!/bin/bash
          touch /tmp/mol_dryrun_vzdump_called
          exit 0
