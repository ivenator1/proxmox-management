---
- name: Verify — lxc_update dry-run
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Load fleet state from converge play
      include_vars:
        file: /tmp/mol_fleet_state.json
  tasks:
    - name: Check fleet record was appended (dry-run always appends)
      assert:
        that:
          - hostvars['localhost']['fleet_lxc_data'] | default([]) | length == 1
        fail_msg: "Dry-run should always produce a fleet record (lxc_dry_run=True is in the when gate)"

    - name: Check record reflects dry-run status
      vars:
        record: "{{ hostvars['localhost']['fleet_lxc_data'][0] }}"
      assert:
        that:
          - record.app == 'no ver info'
          - record.os == ''
        fail_msg: "Dry-run record should have app='no ver info' (no gh_repo) and os='' (dry-run branch)"

    - name: Confirm vzdump was NOT called in dry-run
      stat:
        path: /tmp/mol_dryrun_vzdump_called
      register: vzdump_touch

    - name: Assert vzdump not called
      assert:
        that:
          - not vzdump_touch.stat.exists
        fail_msg: "vzdump should NOT run in dry-run mode (backup task has 'when: not lxc_dry_run')"

    - name: Confirm no failure
      assert:
        that:
          - not (hostvars['localhost']['fleet_failed'] | default(false) | bool)
        fail_msg: "fleet_failed should be False for a dry-run"
