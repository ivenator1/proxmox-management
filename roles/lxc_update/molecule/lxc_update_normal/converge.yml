---
- name: Converge — lxc_update normal (Python flow, vzdump backup, no update script)
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    PATH: "/tmp/mol_stubs:{{ lookup('env', 'PATH') }}"
  tasks:
    - name: Run flow via Python (RunnerExecutor path)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../mol_run_flow.py"
          - "--lxc-id=101"
          - "--node=pve-01"
          - "--host=localhost"
          - "--inventory=/tmp/mol_hosts.ini"
          - "--state-out=/tmp/mol_fleet_state.json"
          - "--strategy=vzdump"
