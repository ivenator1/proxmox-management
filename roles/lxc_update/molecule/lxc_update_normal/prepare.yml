---
- name: Create stub binaries for pct and vzdump
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create stubs directory
      file:
        path: /tmp/mol_stubs
        state: directory
        mode: '0755'

    - name: Clean up previous run state files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/mol_pct_start_called
        - /tmp/mol_pct_stop_called
        - /tmp/mol_lxc_started

    - name: Write pct stub
      copy:
        dest: /tmp/mol_stubs/pct
        mode: '0755'
        content: |
          #!/bin/bash
          CMD="$1"; shift
          case "$CMD" in
            config)
              echo "arch: amd64"
              echo "hostname: sonarr"
              echo "ostype: ubuntu"
              echo "cores: 2"
              echo "memory: 2048"
              echo "tags: community-script"
              ;;
            status)
              echo "status: running"
              ;;
            start)
              touch /tmp/mol_pct_start_called
              ;;
            stop)
              touch /tmp/mol_pct_stop_called
              ;;
            pull)
              # Simulate no update script in container
              exit 1
              ;;
            exec)
              # Strip CTID and '--'
              shift; shift
              CMD_STR="$*"
              if echo "$CMD_STR" | grep -q 'dist-upgrade'; then
                echo "0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded."
              elif echo "$CMD_STR" | grep -q 'reboot-required'; then
                exit 1
              elif echo "$CMD_STR" | grep -q 'apk\|dnf\|upgrade'; then
                echo "OK: 0 packages installed"
              fi
              ;;
            set) exit 0 ;;
            reboot) exit 0 ;;
          esac

    - name: Write vzdump stub (success)
      copy:
        dest: /tmp/mol_stubs/vzdump
        mode: '0755'
        content: |
          #!/bin/bash
          touch /tmp/mol_vzdump_called
          exit 0
