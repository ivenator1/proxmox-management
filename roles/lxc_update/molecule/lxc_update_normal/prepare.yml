---
# Stubs pct, vzdump for a happy-path run:
#   - container running (no start needed)
#   - pct pull fails (no /usr/bin/update → NO SCRIPT)
#   - vzdump succeeds (backup_strategy=vzdump)
#   - OS update: "0 upgraded" (nothing changed)
- name: Prepare stubs and state for lxc_update_normal
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create stubs directory
      file:
        path: /tmp/mol_stubs
        state: directory
        mode: '0755'

    - name: Clean up previous run state files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/mol_pct_start_called
        - /tmp/mol_pct_stop_called
        - /tmp/mol_pct_rollback_called
        - /tmp/mol_vzdump_called
        - /tmp/mol_snap_created
        - /tmp/mol_snap_deleted
        - /tmp/mol_fleet_state.json

    - name: Write pct stub (running, no update script)
      copy:
        dest: /tmp/mol_stubs/pct
        mode: '0755'
        content: |
          #!/bin/bash
          CMD="$1"; shift
          case "$CMD" in
            config)
              echo "arch: amd64"
              echo "hostname: sonarr"
              echo "ostype: ubuntu"
              echo "cores: 2"
              echo "memory: 2048"
              echo "tags: community-script"
              ;;
            status)
              echo "status: running"
              ;;
            start)
              touch /tmp/mol_pct_start_called
              ;;
            stop)
              touch /tmp/mol_pct_stop_called
              ;;
            pull)
              # No update script in container
              exit 1
              ;;
            exec)
              # Strip CTID and '--'
              shift; shift
              CMD_STR="$*"
              if echo "$CMD_STR" | grep -q 'dist-upgrade'; then
                echo "0 upgraded, 0 newly installed, 0 to remove and 0 not upgraded."
              elif echo "$CMD_STR" | grep -q 'reboot-required'; then
                exit 1
              fi
              ;;
            set) exit 0 ;;
            reboot) touch /tmp/mol_pct_reboot_called; exit 0 ;;
            rollback) touch /tmp/mol_pct_rollback_called; exit 0 ;;
            list)
              echo "VMID  Status  Lock  Name"
              echo "101   running       sonarr"
              ;;
          esac

    - name: Write vzdump stub (success)
      copy:
        dest: /tmp/mol_stubs/vzdump
        mode: '0755'
        content: |
          #!/bin/bash
          touch /tmp/mol_vzdump_called
          exit 0

    - name: Install proxmox_fleet package for mol_run_flow.py
      ansible.builtin.pip:
        name: "{{ playbook_dir }}/../../../../"
        editable: true
        state: present
      ignore_errors: yes

    - name: Write minimal localhost inventory for RunnerExecutor
      copy:
        dest: /tmp/mol_hosts.ini
        mode: '0644'
        content: |
          [all]
          localhost ansible_connection=local ansible_python_interpreter={{ ansible_python_interpreter | default('/usr/bin/python3') }}
