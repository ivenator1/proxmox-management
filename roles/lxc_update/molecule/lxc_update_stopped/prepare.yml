---
- name: Create stub pct binary that simulates a stopped container
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create stubs directory
      file:
        path: /tmp/mol_stubs
        state: directory
        mode: '0755'

    - name: Remove stale state files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/mol_pct_start_called
        - /tmp/mol_pct_stop_called
        - /tmp/mol_lxc_started

    - name: Write pct stub — returns stopped first, running after start
      copy:
        dest: /tmp/mol_stubs/pct
        mode: '0755'
        content: |
          #!/bin/bash
          CMD="$1"; shift
          case "$CMD" in
            config)
              echo "arch: amd64"
              echo "hostname: homeassistant"
              echo "ostype: debian"
              echo "cores: 2"
              echo "memory: 2048"
              echo "tags: community-script"
              ;;
            status)
              if [ -f /tmp/mol_lxc_started ]; then
                echo "status: running"
              else
                echo "status: stopped"
              fi
              ;;
            start)
              touch /tmp/mol_lxc_started
              touch /tmp/mol_pct_start_called
              ;;
            stop)
              touch /tmp/mol_pct_stop_called
              ;;
            pull)
              exit 1
              ;;
            exec)
              shift; shift
              CMD_STR="$*"
              if echo "$CMD_STR" | grep -q 'dist-upgrade'; then
                echo "0 upgraded, 0 newly installed, 0 to remove"
              elif echo "$CMD_STR" | grep -q 'reboot-required'; then
                exit 1
              fi
              ;;
            set) exit 0 ;;
          esac

    - name: Write vzdump stub
      copy:
        dest: /tmp/mol_stubs/vzdump
        mode: '0755'
        content: "#!/bin/bash\nexit 0\n"
