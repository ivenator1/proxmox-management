---
# lxc_backup_strategy=snapshot with fake PVE creds: the snapshot cannot be taken,
# so the role records a warning and continues the update (no script → NO SCRIPT).
- name: Converge — lxc_update snapfail
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    PATH: "/tmp/mol_stubs:{{ lookup('env', 'PATH') }}"
  vars:
    lxc_id: "101"
    lxc_dry_run: false
    lxc_backup_strategy: snapshot
    lxc_backup_storage: local
    lxc_kuma_map: {}
    lxc_auto_reboot: false
    pve_api_user: "root@pam"
    pve_api_token_id: "ansible"
    pve_api_token_secret: "mol-fake-secret"
    ansible_host: "127.0.0.1"
    playbook_dir: "{{ molecule_scenario_directory }}/../../../.."
  tasks:
    - name: Run lxc_update role
      include_role:
        name: lxc_update

    - name: Dump fleet state for verify play
      check_mode: false
      copy:
        dest: /tmp/mol_fleet_state.json
        mode: '0644'
        content: "{{ {
          'fleet_lxc_data': hostvars['localhost']['fleet_lxc_data'] | default([]),
          'fleet_changed': hostvars['localhost']['fleet_changed'] | default(false),
          'fleet_failed': hostvars['localhost']['fleet_failed'] | default(false),
          'fleet_error_log': hostvars['localhost']['fleet_error_log'] | default([]),
          'fleet_warning_log': hostvars['localhost']['fleet_warning_log'] | default([])
          } | to_nice_json }}"
