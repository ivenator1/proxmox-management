---
- name: Create stub pct binary that returns a template container
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create stubs directory
      file:
        path: /tmp/mol_stubs
        state: directory
        mode: '0755'

    - name: "Write pct stub — returns template: 1 in config"
      copy:
        dest: /tmp/mol_stubs/pct
        mode: '0755'
        content: |
          #!/bin/bash
          CMD="$1"; shift
          case "$CMD" in
            config)
              echo "arch: amd64"
              echo "hostname: template-app"
              echo "ostype: ubuntu"
              echo "template: 1"
              ;;
            status)
              echo "status: stopped"
              ;;
            *)
              # Any other pct command from within the block would be a test failure
              echo "UNEXPECTED pct call: $CMD $*" >&2
              touch /tmp/mol_template_unexpected_pct_call
              exit 0
              ;;
          esac

    - name: Write vzdump stub (should NOT be called for templates)
      copy:
        dest: /tmp/mol_stubs/vzdump
        mode: '0755'
        content: |
          #!/bin/bash
          touch /tmp/mol_template_vzdump_called
          exit 0

    - name: Remove stale state files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/mol_template_unexpected_pct_call
        - /tmp/mol_template_vzdump_called
