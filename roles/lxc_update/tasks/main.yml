---
- name: "Introspect LXC {{ lxc_id }}"
  include_tasks: introspect.yml

- name: "LXC maintenance block {{ lxc_id }}"
  block:
    - name: "Detect services and resources"
      include_tasks: detect.yml
      when:
        - lxc_is_running | bool
        - not lxc_is_template | bool

    - name: "Backup"
      include_tasks: backup.yml
      when:
        - lxc_is_running | bool
        - not lxc_is_template | bool
        - not lxc_dry_run | bool
        - lxc_backup_strategy != 'none'

    - name: "Warn: snapshot unavailable {{ lxc_id }}"
      include_tasks: "{{ role_path }}/../../tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: warning
        fleet_warning_detail:
          host: "{{ inventory_hostname }}/lxc-{{ lxc_id }}"
          task: "Snapshot {{ lxc_id }}"
          warning: "snapshot failed — automatic rollback unavailable for this update"
      when: lxc_snapshot_failed | default(false) | bool

    - name: "Dry-run version check"
      include_tasks: dry_check.yml
      when:
        - lxc_is_running | bool
        - not lxc_is_template | bool
        - lxc_dry_run | bool

    - name: "Update"
      include_tasks: update.yml
      when:
        - lxc_is_running | bool
        - not lxc_is_template | bool
        - not lxc_dry_run | bool

    - name: "Health check"
      include_tasks: health_check.yml
      when:
        - lxc_is_running | bool
        - not lxc_is_template | bool
        - not lxc_dry_run | bool

    - name: "Report success"
      include_tasks: report.yml

  rescue:
    - name: "Capture failure details"
      set_fact:
        _failed_task_name: "{{ ansible_failed_task.name | default('Unknown task') }}"
        _failed_error: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg) | default('Unknown error') | truncate(300) }}"

    - name: "Roll back to pre-update snapshot {{ lxc_id }}"
      command: "pct rollback {{ lxc_id }} BEFORE_UPDATE_AUTO"
      when:
        - snap_res is defined
        - snap_res.changed | default(false) | bool
      register: rollback_res

    - name: "Wait for container after rollback {{ lxc_id }}"
      command: "pct status {{ lxc_id }}"
      register: rollback_status
      until: "'running' in rollback_status.stdout"
      retries: 12
      delay: 10
      when:
        - rollback_res is defined
        - rollback_res.changed | default(false) | bool

    - name: "Mark rollback performed {{ lxc_id }}"
      set_fact:
        lxc_rollback_done: true
      when:
        - rollback_res is defined
        - rollback_res.changed | default(false) | bool

    - name: "Record failure"
      include_tasks: "{{ role_path }}/../../tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: lxc
        fleet_record_payload:
          node: "{{ inventory_hostname }}"
          name: "{{ lxc_name | default(lxc_id) }}"
          id: "{{ lxc_id }}"
          app: >-
            {{ 'FAILED + ROLLED BACK' if (lxc_rollback_done | default(false))
               else ('FAILED (NO SNAPSHOT)' if (lxc_snapshot_failed | default(false)) else 'FAILED') }}
          os: "FAILED"
          snap: false
        fleet_record_failed: true
        fleet_error_detail:
          host: "{{ inventory_hostname }}/lxc-{{ lxc_id }}"
          task: "{{ _failed_task_name }}"
          error: "{{ _failed_error }}"

  always:
    - name: "Delete snapshot {{ lxc_id }}"
      community.proxmox.proxmox_snap:
        api_host: "{{ ansible_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ lxc_id }}"
        snapname: "BEFORE_UPDATE_AUTO"
        state: absent
      delegate_to: localhost
      register: delete_snap_res
      until: delete_snap_res is succeeded
      retries: 5
      delay: 10
      ignore_errors: yes
      when:
        - snap_res is defined
        - snap_res.changed | default(false) | bool

    - name: "Stop LXC {{ lxc_id }} (was stopped before update)"
      shell: "pct stop {{ lxc_id }}"
      when:
        - lxc_was_stopped | default(false) | bool
        - not lxc_is_template | default(false) | bool
        - not lxc_rollback_done | default(false) | bool
