---
- name: "Build status strings {{ lxc_id }}"
  set_fact:
    tmp_app: >-
      {%- if lxc_is_template | bool -%}TEMPLATE
      {%- elif not lxc_is_running | bool -%}NEVER STARTED
      {%- elif lxc_dry_run | bool -%}{{ dry_run_status | default('dry-run') }}
      {%- elif lxc_no_update_script | default(false) | bool -%}NO SCRIPT
      {%- elif app_update_res is defined and app_update_res is failed -%}FAILED
      {%- elif app_update_res is defined and app_update_res.changed -%}
      {%- if lxc_ver_before is defined and lxc_ver_after is defined
         and lxc_ver_before.stdout | default('') | trim != ''
         and lxc_ver_after.stdout | default('') | trim != ''
         and lxc_ver_before.stdout | trim | regex_replace('^v', '') != lxc_ver_after.stdout | trim | regex_replace('^v', '') -%}
      Updated: {{ lxc_ver_before.stdout | trim }} → {{ lxc_ver_after.stdout | trim }}
      {%- elif lxc_ver_before is defined and lxc_ver_after is defined
         and lxc_ver_before.stdout | default('') | trim != ''
         and lxc_ver_after.stdout | default('') | trim != ''
         and lxc_ver_before.stdout | trim | regex_replace('^v', '') == lxc_ver_after.stdout | trim | regex_replace('^v', '') -%}
      OK
      {%- elif dpkg_hash_before is defined and dpkg_hash_after is defined
         and dpkg_hash_before.stdout | default('') | trim != ''
         and dpkg_hash_after.stdout | default('') | trim != '' -%}
      {%- if dpkg_hash_before.stdout | trim != dpkg_hash_after.stdout | trim -%}UPDATED{%- else -%}OK{%- endif -%}
      {%- else -%}UPDATED{%- endif -%}
      {%- else -%}OK{%- endif -%}
    tmp_os: >-
      {%- if lxc_is_template | bool or not lxc_is_running | bool or lxc_dry_run | bool -%}
      {%- elif lxc_id in (os_update_exclude_list | default([])) -%}SKIPPED
      {%- elif os_update_res is defined and os_update_res is failed -%}FAILED
      {%- elif lxc_reboot_action is defined and lxc_reboot_action.changed -%}
      {%- set _pkg = (os_update_res.stdout | default('') | regex_search('(\\d+ upgraded)', '\\1') or [''])[0] -%}
      Updated{% if _pkg %} ({{ _pkg }}){% endif %} & Rebooted
      {%- elif os_update_res is defined and os_update_res.changed -%}
      {%- set _pkg = (os_update_res.stdout | default('') | regex_search('(\\d+ upgraded)', '\\1') or [''])[0] -%}
      Updated{% if _pkg %} ({{ _pkg }}){% endif %}
      {%- else -%}OK{%- endif -%}

- name: "Append LXC record {{ lxc_id }}"
  include_tasks: "{{ role_path }}/../../tasks/fleet-state-append.yml"
  vars:
    fleet_record_type: lxc
    fleet_record_payload:
      node: "{{ inventory_hostname }}"
      name: "{{ lxc_name }}"
      id: "{{ lxc_id }}"
      app: "{{ tmp_app | trim }}"
      os: "{{ '' if tmp_os is none else tmp_os | trim }}"
      snap: "{{ lxc_id not in (snapshot_exclude_list | default([])) }}"
    fleet_record_changed: >-
      {{ (app_update_res is defined and app_update_res.changed) or
         (os_update_res is defined and os_update_res.changed) or
         (lxc_reboot_action is defined and lxc_reboot_action.changed) }}
    fleet_record_failed: >-
      {{ (app_update_res is defined and app_update_res is failed) or
         (os_update_res is defined and os_update_res is failed) }}
  when: >
    lxc_dry_run | bool or
    (tmp_app | trim | lower) is search('updated|failed|no script|never started') or
    (tmp_os | trim | lower) is search('updated|failed')
