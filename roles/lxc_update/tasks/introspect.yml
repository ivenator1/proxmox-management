---
- name: "Gather LXC config {{ lxc_id }}"
  shell: "pct config {{ lxc_id }}"
  register: lxc_config
  check_mode: false
  changed_when: false

- name: "Set LXC facts"
  set_fact:
    lxc_name: "{{ lxc_config.stdout | regex_search('hostname: (\\S+)', '\\1') | first | default('Unknown') }}"
    lxc_os: "{{ lxc_config.stdout | regex_search('ostype: (\\w+)', '\\1') | first | default('debian') }}"
    lxc_is_template: "{{ 'template: 1' in lxc_config.stdout }}"

- name: "Check LXC status {{ lxc_id }}"
  shell: "pct status {{ lxc_id }}"
  register: lxc_status
  check_mode: false
  changed_when: false

- name: "Set running/stopped facts"
  set_fact:
    lxc_is_running: "{{ 'status: running' in lxc_status.stdout }}"
    lxc_was_stopped: "{{ 'status: stopped' in lxc_status.stdout }}"

- name: "Start stopped LXC {{ lxc_id }}"
  shell: "pct start {{ lxc_id }}"
  when:
    - lxc_was_stopped
    - not lxc_is_template

- name: "Wait for LXC {{ lxc_id }} to be ready"
  pause:
    seconds: 5
  when:
    - lxc_was_stopped
    - not lxc_is_template

- name: "Re-check LXC status after start"
  shell: "pct status {{ lxc_id }}"
  register: lxc_status_recheck
  check_mode: false
  changed_when: false
  when:
    - lxc_was_stopped
    - not lxc_is_template

- name: "Update lxc_is_running after start"
  set_fact:
    lxc_is_running: "{{ 'status: running' in lxc_status_recheck.stdout }}"
  when:
    - lxc_was_stopped
    - not lxc_is_template
