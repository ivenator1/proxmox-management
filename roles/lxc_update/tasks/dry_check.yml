---
- name: "Extract GitHub repo from ct script"
  set_fact:
    gh_repo: "{{ (ct_script_content | regex_search('check_for_gh_release\\s+\"[^\"]+\"\\s+\"([^\"]+)\"', '\\1') or [''])[0] }}"

- name: "Read installed version from container"
  shell: >
    pct exec {{ lxc_id }} -- sh -c
    "cat ~/.{{ ct_script_name.stdout | lower | replace('-','') }} 2>/dev/null || echo ''"
  register: installed_ver
  changed_when: false
  failed_when: false
  when: gh_repo != ''

- name: "Fetch latest GitHub release"
  uri:
    url: "https://api.github.com/repos/{{ gh_repo }}/releases/latest"
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
  delegate_to: localhost
  register: gh_release
  failed_when: false
  when: gh_repo != ''

- name: "Set dry-run status"
  set_fact:
    dry_run_status: >-
      {%- if gh_repo == '' -%}
        no GitHub version info in ct script
      {%- elif gh_release.status | default(0) != 200 -%}
        cannot fetch latest from {{ gh_repo }}
      {%- elif installed_ver.stdout | default('') == '' -%}
        version unknown — latest: {{ (gh_release.json.tag_name | default('?')) }}
      {%- elif installed_ver.stdout | trim | regex_replace('^v', '') == (gh_release.json.tag_name | default('') | trim | regex_replace('^v', '')) -%}
        up to date ({{ installed_ver.stdout | trim }})
      {%- else -%}
        update available: {{ installed_ver.stdout | trim }} → {{ gh_release.json.tag_name | default('?') }}
      {%- endif -%}
