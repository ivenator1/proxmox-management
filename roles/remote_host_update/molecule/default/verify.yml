---
- name: Verify — remote_host_update
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Confirm no failure recorded
      assert:
        that:
          - not (hostvars['localhost']['fleet_failed'] | default(false) | bool)
        fail_msg: "fleet_failed should be False after a clean remote_host_update run"

    - name: Confirm role completed without crashing
      assert:
        that: true
        success_msg: "remote_host_update role ran to completion in check_mode without errors"
