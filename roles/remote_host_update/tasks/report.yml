---
- name: "Resolve package result"
  set_fact:
    remote_pkg_res: >-
      {{ remote_apt_res if (remote_apt_res is defined and remote_apt_res is not skipped)
         else remote_dnf_res if (remote_dnf_res is defined and remote_dnf_res is not skipped)
         else remote_apk_res | default({}) }}

- name: "Append remote host record"
  include_tasks: "{{ playbook_dir }}/tasks/fleet-state-append.yml"
  vars:
    fleet_record_type: remote_host
    fleet_record_payload:
      host: "{{ inventory_hostname }}"
      status: >-
        {%- if remote_pkg_res is failed -%}FAILED
        {%- elif remote_reboot_action is defined and remote_reboot_action.changed -%}UPDATED & REBOOTED
        {%- elif remote_pkg_res.changed | default(false) -%}UPDATED
        {%- else -%}OK{%- endif -%}
    fleet_record_changed: >-
      {{ remote_pkg_res.changed | default(false) or
         (remote_reboot_action is defined and remote_reboot_action.changed) }}
    fleet_record_failed: "{{ remote_pkg_res is failed }}"
  when: >
    remote_pkg_res is failed or
    remote_pkg_res.changed | default(false) or
    (remote_reboot_action is defined and remote_reboot_action.changed)
