---
- name: "Build VM status string"
  set_fact:
    vm_pkg_res: "{{ vm_apt_res if vm_apt_res is defined else vm_dnf_res | default({}) }}"

- name: "Append VM record"
  include_tasks: "{{ playbook_dir }}/tasks/fleet-state-append.yml"
  vars:
    fleet_record_type: vm
    fleet_record_payload:
      node: "{{ pve_node }}"
      name: "{{ inventory_hostname }}"
      vmid: "{{ vmid }}"
      status: >-
        {%- if vm_pkg_res is failed -%}FAILED
        {%- elif vm_reboot_action is defined and vm_reboot_action.changed -%}UPDATED & REBOOTED
        {%- elif vm_pkg_res.changed | default(false) -%}UPDATED
        {%- else -%}OK{%- endif -%}
    fleet_record_changed: >-
      {{ vm_pkg_res.changed | default(false) or
         (vm_reboot_action is defined and vm_reboot_action.changed) }}
    fleet_record_failed: "{{ vm_pkg_res is failed }}"
  when: >
    vm_pkg_res is failed or
    vm_pkg_res.changed | default(false) or
    (vm_reboot_action is defined and vm_reboot_action.changed)
