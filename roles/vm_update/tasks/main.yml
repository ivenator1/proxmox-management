---
- name: "VM maintenance block {{ inventory_hostname }}"
  block:
    - name: "Snapshot"
      include_tasks: snapshot.yml
      when: not (vm_dry_run | default(false) | bool)

    - name: "Warn: snapshot unavailable {{ vmid }}"
      include_tasks: "{{ role_path }}/../../tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: warning
        fleet_warning_detail:
          host: "{{ pve_node }}/vm-{{ vmid }}"
          task: "Snapshot {{ vmid }}"
          warning: "snapshot failed — automatic rollback unavailable for this update"
      when: vm_snapshot_failed | default(false) | bool

    - name: "Update packages"
      include_tasks: update.yml

    - name: "Health check"
      include_tasks: health_check.yml
      when: not (vm_dry_run | default(false) | bool)

    - name: "Report success"
      include_tasks: report.yml

  rescue:
    - name: "Capture failure details"
      set_fact:
        _failed_task_name: "{{ ansible_failed_task.name | default('Unknown task') }}"
        _failed_error: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg) | default('Unknown error') | truncate(300) }}"

    - name: "Roll back VM to pre-update snapshot {{ vmid }}"
      command: "qm rollback {{ vmid }} BEFORE_UPDATE_AUTO"
      delegate_to: "{{ pve_node }}"
      when:
        - vm_snap_res is defined
        - vm_snap_res.changed | default(false) | bool
      register: vm_rollback_res

    - name: "Wait for VM after rollback {{ vmid }}"
      command: "qm status {{ vmid }}"
      delegate_to: "{{ pve_node }}"
      register: vm_rollback_status
      until: "'running' in vm_rollback_status.stdout"
      retries: 12
      delay: 10
      when:
        - vm_rollback_res is defined
        - vm_rollback_res.changed | default(false) | bool

    - name: "Mark VM rollback performed {{ vmid }}"
      set_fact:
        vm_rollback_done: true
      when:
        - vm_rollback_res is defined
        - vm_rollback_res.changed | default(false) | bool

    - name: "Record failure"
      include_tasks: "{{ role_path }}/../../tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: vm
        fleet_record_payload:
          node: "{{ pve_node }}"
          name: "{{ inventory_hostname }}"
          vmid: "{{ vmid }}"
          status: >-
            {{ 'FAILED + ROLLED BACK' if (vm_rollback_done | default(false))
               else ('FAILED (NO SNAPSHOT)' if (vm_snapshot_failed | default(false)) else 'FAILED') }}
        fleet_record_failed: true
        fleet_error_detail:
          host: "{{ pve_node }}/vm-{{ vmid }}"
          task: "{{ _failed_task_name }}"
          error: "{{ _failed_error }}"

  always:
    - name: "Delete VM snapshot"
      community.proxmox.proxmox_snap:
        api_host: "{{ hostvars[pve_node]['ansible_host'] }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ pve_api_token_secret }}"
        vmid: "{{ vmid }}"
        snapname: "BEFORE_UPDATE_AUTO"
        state: absent
      delegate_to: localhost
      register: delete_vm_snap_res
      until: delete_vm_snap_res is succeeded
      retries: 5
      delay: 10
      ignore_errors: yes
      when:
        - vm_snap_res is defined
        - vm_snap_res.changed | default(false) | bool
