---
- name: "Vzdump backup of VM {{ vmid }}"
  shell: >
    vzdump {{ vmid }} --compress zstd --storage {{ vm_backup_storage }}
    --notes-template "{{ inventory_hostname }} - ansible fleet-update"
  delegate_to: "{{ pve_node }}"
  when: vm_backup_strategy in ['both']

- name: "Snapshot VM {{ inventory_hostname }}"
  community.proxmox.proxmox_snap:
    api_host: "{{ hostvars[pve_node]['ansible_host'] }}"
    api_user: "{{ pve_api_user }}"
    api_token_id: "{{ pve_api_token_id }}"
    api_token_secret: "{{ pve_api_token_secret }}"
    vmid: "{{ vmid }}"
    snapname: "BEFORE_UPDATE_AUTO"
    state: present
  delegate_to: localhost
  register: vm_snap_res
  failed_when: false
  when: vm_backup_strategy in ['snapshot', 'both']

# Snapshot wanted but not taken → rollback impossible; surface it (see backup.yml note).
- name: "Flag VM snapshot failure {{ vmid }}"
  set_fact:
    vm_snapshot_failed: true
  when:
    - vm_backup_strategy in ['snapshot', 'both']
    - not (vm_snap_res.changed | default(false) | bool)
