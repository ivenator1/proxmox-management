---
# Dry-run: simulate via check_mode and report what WOULD change. No reboot.
- name: "Simulate VM updates (dry-run)"
  block:
    - name: "Simulate apt {{ inventory_hostname }}"
      apt:
        upgrade: dist
        update_cache: yes
      check_mode: yes
      register: vm_apt_res
      when: ansible_pkg_mgr == 'apt'

    - name: "Simulate dnf {{ inventory_hostname }}"
      dnf:
        name: "*"
        state: latest
        update_cache: yes
      check_mode: yes
      register: vm_dnf_res
      when: ansible_pkg_mgr == 'dnf'
  when: vm_dry_run | default(false) | bool

- name: "Apply VM updates"
  block:
    - name: "Update VM packages (apt)"
      apt:
        upgrade: dist
        update_cache: yes
        autoremove: yes
      register: vm_apt_res
      when: ansible_pkg_mgr == 'apt'
      changed_when:
        - vm_apt_res is succeeded
        - vm_apt_res.stdout is defined
        - "'0 upgraded, 0 newly installed' not in vm_apt_res.stdout"

    - name: "Update VM packages (dnf)"
      dnf:
        name: "*"
        state: latest
        update_cache: yes
      register: vm_dnf_res
      when: ansible_pkg_mgr == 'dnf'

    - name: "Check reboot-required"
      stat:
        path: /var/run/reboot-required
      register: vm_reboot_file

    - name: "Reboot VM {{ inventory_hostname }}"
      reboot:
        reboot_timeout: 600
        post_reboot_delay: 30
      register: vm_reboot_action
      when:
        - vm_auto_reboot | bool
        - vm_reboot_file.stat.exists
  when: not (vm_dry_run | default(false) | bool)
