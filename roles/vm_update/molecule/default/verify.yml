---
- name: Verify — vm_update
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Load fleet state from converge play
      include_vars:
        file: /tmp/mol_fleet_state.json
  tasks:
    - name: Confirm no failure recorded
      assert:
        that:
          - not (hostvars['localhost']['fleet_failed'] | default(false) | bool)
        fail_msg: "fleet_failed should be False after a clean vm_update run"

    - name: Confirm role completed without crashing
      assert:
        that: true
        success_msg: "vm_update role ran to completion in check_mode without errors"
