---
- name: "Load custom config {{ inventory_hostname }}"
  include_tasks: load_config.yml

- name: "Maintenance window check {{ inventory_hostname }}"
  include_tasks: "{{ role_path }}/../../tasks/check-window.yml"
  when: maintenance_window is defined

# Dependency gating: if any host this one depends_on already FAILED this run,
# skip (serial:1 + Phase 0a ordering guarantee the dependency ran first).
- name: "Dependency check {{ inventory_hostname }}"
  set_fact:
    _dep_failed: >-
      {{ ((depends_on | default([]))
          | intersect((hostvars['localhost']['fleet_custom_data'] | default([]))
                      | selectattr('app', 'search', 'FAILED') | map(attribute='host') | list))
         | length > 0 }}
  when: (depends_on | default([])) | length > 0

- name: "Record dependency skip {{ inventory_hostname }}"
  include_tasks: "{{ role_path }}/../../tasks/fleet-state-append.yml"
  vars:
    fleet_record_type: warning
    fleet_warning_detail:
      host: "{{ inventory_hostname }}"
      task: "Dependency check"
      warning: "skipped — a dependency failed earlier this run"
  when: _dep_failed | default(false) | bool

- name: "Custom system maintenance block {{ inventory_hostname }}"
  when:
    - (maintenance_window is not defined) or (_in_window | default(true) | bool)
    - not (_dep_failed | default(false) | bool)
  block:
    - name: "Detect version and latest"
      include_tasks: detect.yml

    - name: "Backup"
      include_tasks: backup.yml
      when:
        - not custom_dry_run | bool
        - custom_cfg.backup_command | default('') | trim != ''

    - name: "Update"
      include_tasks: update.yml
      when:
        - not custom_dry_run | bool
        - (not (custom_cfg.update_only_if_outdated | default(false) | bool)) or (custom_is_outdated | default(true) | bool)

    - name: "Health check"
      include_tasks: health_check.yml
      when:
        - not custom_dry_run | bool
        - custom_changed | default(false) | bool
        - (custom_cfg.health_check | default({})).type | default('none') != 'none'

    - name: "Report"
      include_tasks: report.yml

  rescue:
    - name: "Capture failure details"
      set_fact:
        _failed_task_name: "{{ ansible_failed_task.name | default('Unknown task') }}"
        _failed_error: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg) | default('Unknown error') | truncate(300) }}"

    - name: "Run rollback command {{ inventory_hostname }}"
      shell: "{{ custom_cfg.rollback_command }}"
      when: custom_cfg.rollback_command | default('') | trim != ''
      ignore_errors: yes

    - name: "Record failure"
      include_tasks: "{{ role_path }}/../../tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: custom
        fleet_record_payload:
          host: "{{ inventory_hostname }}"
          name: "{{ custom_cfg.name | default(inventory_hostname) }}"
          app: "FAILED"
        fleet_record_failed: true
        fleet_error_detail:
          host: "{{ inventory_hostname }}"
          task: "{{ _failed_task_name }}"
          error: "{{ _failed_error }}"
