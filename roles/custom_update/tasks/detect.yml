---
- name: "Initialize version facts {{ inventory_hostname }}"
  set_fact:
    custom_ver_before: ''
    custom_latest_ver: ''

- name: "Read current version {{ inventory_hostname }}"
  shell: "{{ custom_cfg.version_command }}"
  register: _custom_ver_before_res
  changed_when: false
  failed_when: false
  when: custom_cfg.version_command | default('') | trim != ''

- name: "Apply version before {{ inventory_hostname }}"
  set_fact:
    custom_ver_before: "{{ _custom_ver_before_res.stdout | default('') | trim }}"
  when:
    - _custom_ver_before_res is defined
    - not (_custom_ver_before_res.skipped | default(false))

# latest_version is needed for the dry-run report and for the update_only_if_outdated
# gate; resolve it only when one of those is active (no wasted API call otherwise).
- name: "Resolve latest version from GitHub release {{ inventory_hostname }}"
  uri:
    url: "https://api.github.com/repos/{{ (custom_cfg.latest_version | default({})).repo | default('') }}/releases/latest"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
    return_content: yes
  register: _custom_github_res
  delegate_to: localhost
  changed_when: false
  failed_when: false
  when:
    - custom_dry_run | bool or (custom_cfg.update_only_if_outdated | default(false) | bool)
    - (custom_cfg.latest_version | default({})).type | default('none') == 'github_release'
    - (custom_cfg.latest_version | default({})).repo | default('') | trim != ''

- name: "Apply latest version from GitHub {{ inventory_hostname }}"
  set_fact:
    custom_latest_ver: "{{ (_custom_github_res.json | default({})).tag_name | default('') | trim }}"
  when:
    - _custom_github_res is defined
    - not (_custom_github_res.skipped | default(false))
    - not (_custom_github_res.failed | default(false))

- name: "Resolve latest version from command {{ inventory_hostname }}"
  shell: "{{ (custom_cfg.latest_version | default({})).command | default('true') }}"
  register: _custom_latest_cmd_res
  delegate_to: localhost
  changed_when: false
  failed_when: false
  when:
    - custom_dry_run | bool or (custom_cfg.update_only_if_outdated | default(false) | bool)
    - (custom_cfg.latest_version | default({})).type | default('none') == 'command'
    - (custom_cfg.latest_version | default({})).command | default('') | trim != ''

- name: "Apply latest version from command {{ inventory_hostname }}"
  set_fact:
    custom_latest_ver: "{{ _custom_latest_cmd_res.stdout | default('') | trim }}"
  when:
    - _custom_latest_cmd_res is defined
    - not (_custom_latest_cmd_res.skipped | default(false))
    - not (_custom_latest_cmd_res.failed | default(false))

# Outdated gate (Tier 5). Only meaningful when update_only_if_outdated is set.
# Fail-open: if latest can't be resolved, treat as outdated (update) and warn.
- name: "Determine outdated status {{ inventory_hostname }}"
  set_fact:
    custom_is_outdated: >-
      {{ true if (custom_latest_ver | default('') | trim == '')
         else (custom_ver_before | default('') | trim | regex_replace('^v', '')
               != custom_latest_ver | default('') | trim | regex_replace('^v', '')) }}
  when: custom_cfg.update_only_if_outdated | default(false) | bool

- name: "Warn: latest version unresolved {{ inventory_hostname }}"
  include_tasks: "{{ role_path }}/../../tasks/fleet-state-append.yml"
  vars:
    fleet_record_type: warning
    fleet_warning_detail:
      host: "{{ inventory_hostname }}"
      task: "Detect latest version"
      warning: "could not resolve latest version; updating anyway (update_only_if_outdated fail-open)"
  when:
    - custom_cfg.update_only_if_outdated | default(false) | bool
    - not custom_dry_run | bool
    - custom_latest_ver | default('') | trim == ''
