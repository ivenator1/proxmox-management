---
- name: "Run update step - {{ step.name }}"
  shell: "{{ step.command }}"
  loop: "{{ custom_cfg.update_steps | default([]) }}"
  loop_control:
    loop_var: step
    label: "{{ step.name }}"
  register: custom_update_steps_res

- name: "Read version after update {{ inventory_hostname }}"
  shell: "{{ custom_cfg.version_command }}"
  register: _custom_ver_after_res
  changed_when: false
  failed_when: false
  when: custom_cfg.version_command | default('') | trim != ''

- name: "Apply version after {{ inventory_hostname }}"
  set_fact:
    custom_ver_after: "{{ _custom_ver_after_res.stdout | default('') | trim }}"
  when:
    - _custom_ver_after_res is defined
    - not (_custom_ver_after_res.skipped | default(false))

- name: "Check changed_when command {{ inventory_hostname }}"
  shell: "{{ (custom_cfg.changed_when | default({})).command }}"
  register: custom_changed_cmd_res
  changed_when: false
  failed_when: false
  when:
    - (custom_cfg.changed_when | default({})).type | default('version') == 'command'
    - (custom_cfg.changed_when | default({})).command | default('') | trim != ''

# Single source of truth for "did this system actually change?" — consumed by
# both health_check.yml (gate) and report.yml (fleet_record_changed). Mirrors
# the tmp_custom decision tree in report.yml minus the display formatting.
- name: "Determine change status {{ inventory_hostname }}"
  set_fact:
    custom_changed: >-
      {{
        (true if ((custom_cfg.changed_when | default({})).type | default('version')) == 'always'
         else (
           ((custom_changed_cmd_res.rc | default(1)) == 0)
           if (((custom_cfg.changed_when | default({})).type | default('version')) == 'command'
               and custom_changed_cmd_res is defined
               and not (custom_changed_cmd_res.skipped | default(false)))
           else (
             (custom_ver_before | default('') | trim != custom_ver_after | default('') | trim)
             if (custom_ver_before | default('') | trim != ''
                 and custom_ver_after | default('') | trim != '')
             else true
           )
         )) | bool
      }}

- name: "Reboot {{ inventory_hostname }}"
  reboot:
    reboot_timeout: 600
    post_reboot_delay: 30
  register: custom_reboot_res
  when:
    - custom_changed | default(true) | bool
    - custom_cfg.reboot | default(false) | bool
    - custom_allow_reboot | default(true) | bool
