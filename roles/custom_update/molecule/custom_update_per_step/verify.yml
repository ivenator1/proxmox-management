---
- name: Verify — custom_update per-step controls
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Registered output was consumed by a later step
      slurp:
        src: /tmp/mol_perstep_used
      register: used

    - name: Assert the register value propagated
      assert:
        that:
          - "'HELLO' in (used.content | b64decode)"
        fail_msg: "Later step should have received custom_step_results['greeting'] == HELLO"

    - name: The when:false step did NOT run
      stat:
        path: /tmp/mol_perstep_skip_ran
      register: skip_marker

    - name: Assert skipped step skipped
      assert:
        that:
          - not skip_marker.stat.exists
        fail_msg: "A step with when:false must not execute"
