---
- name: Converge — custom_update rescue (update step fails → rescue fires)
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    PATH: "/tmp/mol_stubs:{{ lookup('env', 'PATH') }}"
  vars:
    custom_config: mol_test_rescue
    custom_dry_run: false
    playbook_dir: /tmp/mol_custom_rescue
  tasks:
    - name: Run custom_update role
      include_role:
        name: custom_update

    - name: Dump fleet state for verify play
      check_mode: false
      copy:
        dest: /tmp/mol_fleet_state_rescue.json
        mode: '0644'
        content: "{{ {
          'fleet_custom_data': hostvars['localhost']['fleet_custom_data'] | default([]),
          'fleet_changed': hostvars['localhost']['fleet_changed'] | default(false),
          'fleet_failed': hostvars['localhost']['fleet_failed'] | default(false),
          'fleet_error_log': hostvars['localhost']['fleet_error_log'] | default([])
          } | to_nice_json }}"
