---
- name: Converge — custom_update rescue (Python flow, update step fails → rescue fires)
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    PATH: "/tmp/mol_stubs:{{ lookup('env', 'PATH') }}"
  tasks:
    - name: Run flow via Python (RunnerExecutor path)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../mol_run_flow.py"
          - "--config-file=/tmp/mol_custom_rescue/configs/mol_test_rescue.yml"
          - "--host=localhost"
          - "--inventory=/tmp/mol_hosts.ini"
          - "--state-out=/tmp/mol_fleet_state_rescue.json"
