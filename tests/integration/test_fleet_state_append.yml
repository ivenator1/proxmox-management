---
# Integration test for tasks/fleet-state-append.yml
# Run with: ansible-playbook tests/integration/test_fleet_state_append.yml
#
# Validates that delegate_to: localhost + delegate_facts: true actually
# writes back to hostvars['localhost'] — the trickiest behaviour of the
# state accumulator that pytest cannot exercise.
- name: Test fleet-state-append accumulation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    playbook_dir: "{{ playbook_dir | default((lookup('env', 'PWD'))) }}"
  tasks:
    - name: Append first LXC record
      include_tasks: "{{ playbook_dir }}/tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: lxc
        fleet_record_payload:
          node: "pve-01"
          name: "sonarr"
          id: "101"
          app: "Updated: v4.0 → v4.1"
          os: "OK"
          snap: true
        fleet_record_changed: true
        fleet_record_failed: false

    - name: Append second LXC record
      include_tasks: "{{ playbook_dir }}/tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: lxc
        fleet_record_payload:
          node: "pve-01"
          name: "radarr"
          id: "102"
          app: "OK"
          os: "OK"
          snap: true
        fleet_record_changed: false
        fleet_record_failed: false

    - name: Append a VM record
      include_tasks: "{{ playbook_dir }}/tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: vm
        fleet_record_payload:
          node: "pve-01"
          vmid: "200"
          name: "my-vm"
          status: "UPDATED"
        fleet_record_changed: true
        fleet_record_failed: false

    - name: Append a remote host record
      include_tasks: "{{ playbook_dir }}/tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: remote_host
        fleet_record_payload:
          host: "my-server"
          status: "UPDATED & REBOOTED"
        fleet_record_changed: true
        fleet_record_failed: false

    - name: Append a failed node record with error detail
      include_tasks: "{{ playbook_dir }}/tasks/fleet-state-append.yml"
      vars:
        fleet_record_type: node
        fleet_record_payload:
          node: "pve-02"
          status: "FAILED"
        fleet_record_changed: false
        fleet_record_failed: true
        fleet_error_detail:
          host: "pve-02"
          task: "Update Host OS"
          error: "apt lock timeout after 300s"

    - name: Assert final state — list lengths
      vars:
        lxc_data: "{{ hostvars['localhost']['fleet_lxc_data'] }}"
        vm_data: "{{ hostvars['localhost']['fleet_vm_data'] }}"
        remote_data: "{{ hostvars['localhost']['fleet_remote_data'] }}"
        node_data: "{{ hostvars['localhost']['fleet_node_data'] }}"
        error_log: "{{ hostvars['localhost']['fleet_error_log'] }}"
      assert:
        that:
          - lxc_data | length == 2
          - vm_data | length == 1
          - remote_data | length == 1
          - node_data | length == 1
          - error_log | length == 1
        fail_msg: >
          List lengths wrong.
          lxc={{ lxc_data | length }}, vm={{ vm_data | length }},
          remote={{ remote_data | length }}, node={{ node_data | length }},
          errors={{ error_log | length }}

    - name: Assert LXC record content
      vars:
        lxc_data: "{{ hostvars['localhost']['fleet_lxc_data'] }}"
      assert:
        that:
          - lxc_data[0].id == '101'
          - lxc_data[0].name == 'sonarr'
          - lxc_data[0].app == 'Updated: v4.0 → v4.1'
          - lxc_data[1].id == '102'
          - lxc_data[1].name == 'radarr'
        fail_msg: "LXC records have unexpected content: {{ lxc_data }}"

    - name: Assert fleet_changed and fleet_failed flags
      assert:
        that:
          - hostvars['localhost']['fleet_changed'] | bool
          - hostvars['localhost']['fleet_failed'] | bool
        fail_msg: >
          fleet_changed={{ hostvars['localhost']['fleet_changed'] }},
          fleet_failed={{ hostvars['localhost']['fleet_failed'] }}

    - name: Assert error log content
      vars:
        error_log: "{{ hostvars['localhost']['fleet_error_log'] }}"
      assert:
        that:
          - error_log[0].host == 'pve-02'
          - error_log[0].task == 'Update Host OS'
          - error_log[0].error == 'apt lock timeout after 300s'
        fail_msg: "Error log entry has unexpected content: {{ error_log[0] }}"

    - name: Print pass summary
      debug:
        msg: "All fleet-state-append integration assertions passed."
